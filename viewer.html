document.write('<html lang="zh-CN"><head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<meta name="apple-mobile-web-app-title" content="考公工作台">\n<meta name="theme-color" content="#2d6cdf">\n<title>考公专属工作台</title>\n\n<!-- iOS 桌面图标 -->\n<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns=\'http://www.w3.org/2000/svg\'%20width=\'180\'%20height=\'180\'%3E%3Crect%20width=\'180\'%20height=\'180\'%20rx=\'40\'%20fill=\'%232d6cdf\'/%3E%3Ctext%20x=\'90\'%20y=\'120\'%20font-size=\'90\'%20text-anchor=\'middle\'%20fill=\'white\'%20font-family=\'sans-serif\'%3E%E8%80%83%3C/text%3E%3C/svg%3E">\n<link rel="apple-touch-icon" sizes="120x120" href="data:image/svg+xml,%3Csvg%20xmlns=\'http://www.w3.org/2000/svg\'%20width=\'120\'%20height=\'120\'%3E%3Crect%20width=\'120\'%20height=\'120\'%20rx=\'26\'%20fill=\'%232d6cdf\'/%3E%3Ctext%20x=\'60\'%20y=\'82\'%20font-size=\'60\'%20text-anchor=\'middle\'%20fill=\'white\'%20font-family=\'sans-serif\'%3E%E8%80%83%3C/text%3E%3C/svg%3E">\n<link rel="apple-touch-icon" sizes="152x152" href="data:image/svg+xml,%3Csvg%20xmlns=\'http://www.w3.org/2000/svg\'%20width=\'152\'%20height=\'152\'%3E%3Crect%20width=\'152\'%20height=\'152\'%20rx=\'34\'%20fill=\'%232d6cdf\'/%3E%3Ctext%20x=\'76\'%20y=\'104\'%20font-size=\'76\'%20text-anchor=\'middle\'%20fill=\'white\'%20font-family=\'sans-serif\'%3E%E8%80%83%3C/text%3E%3C/svg%3E">\n<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg%20xmlns=\'http://www.w3.org/2000/svg\'%20width=\'180\'%20height=\'180\'%3E%3Crect%20width=\'180\'%20height=\'180\'%20rx=\'40\'%20fill=\'%232d6cdf\'/%3E%3Ctext%20x=\'90\'%20y=\'120\'%20font-size=\'90\'%20text-anchor=\'middle\'%20fill=\'white\'%20font-family=\'sans-serif\'%3E%E8%80%83%3C/text%3E%3C/svg%3E">\n<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=\'http://www.w3.org/2000/svg\'%20width=\'32\'%20height=\'32\'%3E%3Crect%20width=\'32\'%20height=\'32\'%20rx=\'7\'%20fill=\'%232d6cdf\'/%3E%3Ctext%20x=\'16\'%20y=\'23\'%20font-size=\'18\'%20text-anchor=\'middle\'%20fill=\'white\'%20font-family=\'sans-serif\'%3E%E8%80%83%3C/text%3E%3C/svg%3E">\n\n<style>\n:root {\n    --primary: #2d6cdf;\n    --primary-light: #4a8de0;\n    --primary-dark: #1a4ba0;\n    --primary-bg: #e8f0fe;\n    --accent: #ff6b6b;\n    --success: #52c41a;\n    --warning: #faad14;\n    --danger: #ff4d4f;\n    --bg: #f0f2f5;\n    --card-bg: #ffffff;\n    --text: #1f1f1f;\n    --text-secondary: #666;\n    --text-tertiary: #999;\n    --border: #e8e8e8;\n    --shadow: 0 2px 8px rgba(0,0,0,0.08);\n    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);\n    --radius: 12px;\n    --radius-sm: 8px;\n    --nav-width: 110px;\n}\n\n* { margin:0; padding:0; box-sizing:border-box; }\n\nbody {\n    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;\n    background: var(--bg);\n    color: var(--text);\n    line-height: 1.6;\n    overflow: hidden;\n    height: 100vh;\n}\n\n/* ============ 顶部倒计时栏 ============ */\n.top-bar {\n    height: 52px;\n    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);\n    color: #fff;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 0 10px;\n    box-shadow: 0 2px 12px rgba(45,108,223,0.3);\n    z-index: 100;\n    position: relative;\n    gap: 6px;\n}\n\n.top-bar .logo {\n    font-size: 14px;\n    font-weight: 700;\n    display: flex;\n    align-items: center;\n    gap: 4px;\n    white-space: nowrap;\n    flex-shrink: 0;\n}\n\n.top-bar .logo .icon {\n    font-size: 18px;\n}\n\n.countdown-wrapper {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    flex-shrink: 1;\n    overflow: hidden;\n}\n\n.exam-switch {\n    display: flex;\n    gap: 2px;\n    background: rgba(255,255,255,0.15);\n    border-radius: 6px;\n    padding: 2px;\n}\n\n.exam-switch button {\n    padding: 4px 8px;\n    border: none;\n    background: transparent;\n    color: rgba(255,255,255,0.7);\n    cursor: pointer;\n    border-radius: 4px;\n    font-size: 12px;\n    font-weight: 500;\n    transition: all 0.3s;\n    white-space: nowrap;\n}\n\n.exam-switch button.active {\n    background: #fff;\n    color: var(--primary);\n}\n\n.countdown-display {\n    display: flex;\n    align-items: baseline;\n    gap: 3px;\n    white-space: nowrap;\n}\n\n.countdown-display .label {\n    font-size: 11px;\n    opacity: 0.85;\n}\n\n@media (max-width: 480px) {\n    .countdown-display .label { display: none; }\n    .top-bar { padding: 0 6px; gap: 4px; }\n    .top-bar .logo { font-size: 12px; }\n    .top-bar .logo .icon { font-size: 16px; }\n    .countdown-wrapper { gap: 4px; }\n    .exam-switch button { padding: 3px 6px; font-size: 11px; }\n    .countdown-display .days { font-size: 18px; }\n    .countdown-display .unit { font-size: 10px; }\n    .date-setting { display: none; }\n}\n\n.countdown-display .days {\n    font-size: 22px;\n    font-weight: 800;\n    text-shadow: 0 2px 8px rgba(0,0,0,0.2);\n    line-height: 1;\n}\n\n.countdown-display .unit {\n    font-size: 12px;\n    opacity: 0.85;\n}\n\n.date-setting {\n    font-size: 10px;\n    opacity: 0.7;\n    cursor: pointer;\n    text-decoration: underline;\n    white-space: nowrap;\n}\n\n.date-setting-mobile {\n    display: none;\n    font-size: 10px;\n    opacity: 0.7;\n    cursor: pointer;\n    text-decoration: underline;\n    white-space: nowrap;\n}\n\n@media (max-width: 480px) {\n    .countdown-display .label { display: none; }\n    .top-bar { padding: 0 6px; gap: 4px; }\n    .top-bar .logo { font-size: 12px; }\n    .top-bar .logo .icon { font-size: 16px; }\n    .countdown-wrapper { gap: 4px; }\n    .exam-switch button { padding: 3px 6px; font-size: 11px; }\n    .countdown-display .days { font-size: 18px; }\n    .countdown-display .unit { font-size: 10px; }\n    .date-setting { display: none; }\n    .date-setting-mobile { display: inline; }\n    .content-area { padding: 10px 8px; }\n    .card { padding: 12px 10px; }\n    .page-title { font-size: 16px; }\n}\n.main-layout {\n    display: flex;\n    height: calc(100vh - 52px);\n}\n\n/* ============ 左侧导航 - 紧凑文字模式 ============ */\n.sidebar {\n    width: var(--nav-width);\n    background: var(--card-bg);\n    border-right: 1px solid var(--border);\n    display: flex;\n    flex-direction: column;\n    overflow-y: auto;\n    overflow-x: hidden;\n    flex-shrink: 0;\n    position: relative;\n    z-index: 10;\n}\n\n.nav-section {\n    padding: 6px 0;\n    border-bottom: 1px solid var(--border);\n}\n\n.nav-section:last-child { border-bottom: none; }\n\n.nav-section-title {\n    font-size: 9px;\n    color: var(--text-tertiary);\n    letter-spacing: 0.5px;\n    padding: 2px 8px;\n    margin-bottom: 2px;\n    white-space: nowrap;\n}\n\n.nav-item {\n    padding: 9px 6px;\n    cursor: pointer;\n    font-size: 12px;\n    color: var(--text-secondary);\n    display: flex;\n    align-items: center;\n    gap: 4px;\n    transition: all 0.2s;\n    border-left: 3px solid transparent;\n    font-weight: 500;\n    white-space: nowrap;\n    line-height: 1.4;\n}\n\n.nav-item:hover {\n    background: var(--primary-bg);\n    color: var(--primary);\n}\n\n.nav-item.active {\n    background: var(--primary-bg);\n    color: var(--primary);\n    border-left-color: var(--primary);\n    font-weight: 600;\n}\n\n.nav-item .nav-icon {\n    font-size: 15px;\n    width: 18px;\n    text-align: center;\n    flex-shrink: 0;\n}\n\n.nav-item .nav-text {\n    overflow: hidden;\n    text-overflow: ellipsis;\n}\n\n.nav-sub-item {\n    padding: 7px 8px 7px 28px;\n    cursor: pointer;\n    font-size: 11px;\n    color: var(--text-secondary);\n    transition: all 0.2s;\n    border-left: 3px solid transparent;\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n}\n\n.nav-sub-item:hover {\n    color: var(--primary);\n    background: var(--primary-bg);\n}\n\n.nav-sub-item.active {\n    color: var(--primary);\n    font-weight: 600;\n    border-left-color: var(--primary-light);\n}\n\n/* ============ 右侧内容区 ============ */\n.content-area {\n    flex: 1;\n    overflow-y: auto;\n    padding: 16px 14px;\n    min-width: 0;\n}\n\n.content-section { display: none; }\n.content-section.active { display: block; }\n\n/* ============ 通用组件 ============ */\n.page-title {\n    font-size: 22px;\n    font-weight: 700;\n    margin-bottom: 4px;\n    color: var(--text);\n}\n\n.page-subtitle {\n    font-size: 14px;\n    color: var(--text-tertiary);\n    margin-bottom: 20px;\n}\n\n.card {\n    background: var(--card-bg);\n    border-radius: var(--radius);\n    box-shadow: var(--shadow);\n    padding: 20px;\n    margin-bottom: 16px;\n    transition: box-shadow 0.3s;\n}\n\n.card:hover {\n    box-shadow: var(--shadow-lg);\n}\n\n.card-title {\n    font-size: 16px;\n    font-weight: 600;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n}\n\n.card-title .badge {\n    font-size: 11px;\n    padding: 2px 8px;\n    border-radius: 10px;\n    background: var(--primary-bg);\n    color: var(--primary);\n    font-weight: 500;\n}\n\n/* 网格布局 */\n.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }\n.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n\n@media (max-width: 1024px) {\n    .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }\n    .grid-2 { grid-template-columns: 1fr; }\n}\n@media (max-width: 768px) {\n    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }\n    .content-area { padding: 12px 10px; }\n    .card { padding: 14px 12px; }\n    .page-title { font-size: 18px; }\n}\n\n/* 表单 */\n.form-group {\n    margin-bottom: 14px;\n}\n\n.form-label {\n    display: block;\n    font-size: 13px;\n    color: var(--text-secondary);\n    margin-bottom: 6px;\n    font-weight: 500;\n}\n\n.form-input, .form-select {\n    width: 100%;\n    padding: 9px 12px;\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    font-size: 14px;\n    outline: none;\n    transition: border-color 0.3s;\n    background: #fff;\n}\n\n.form-input:focus, .form-select:focus {\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px rgba(45,108,223,0.1);\n}\n\n/* 按钮 */\n.btn {\n    padding: 9px 20px;\n    border: none;\n    border-radius: var(--radius-sm);\n    cursor: pointer;\n    font-size: 14px;\n    font-weight: 500;\n    transition: all 0.3s;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n}\n\n.btn-primary {\n    background: var(--primary);\n    color: #fff;\n}\n.btn-primary:hover { background: var(--primary-dark); }\n\n.btn-outline {\n    background: #fff;\n    color: var(--primary);\n    border: 1px solid var(--primary);\n}\n.btn-outline:hover { background: var(--primary-bg); }\n\n.btn-sm { padding: 5px 12px; font-size: 13px; }\n\n/* 进度条 */\n.progress-bar {\n    width: 100%;\n    height: 8px;\n    background: #f0f0f0;\n    border-radius: 4px;\n    overflow: hidden;\n}\n\n.progress-bar .fill {\n    height: 100%;\n    background: linear-gradient(90deg, var(--primary), var(--primary-light));\n    border-radius: 4px;\n    transition: width 0.5s ease;\n}\n\n.progress-bar .fill.success { background: linear-gradient(90deg, var(--success), #73d13d); }\n.progress-bar .fill.warning { background: linear-gradient(90deg, var(--warning), #ffc53d); }\n.progress-bar .fill.danger { background: linear-gradient(90deg, var(--danger), #ff7875); }\n\n/* 统计卡片 */\n.stat-card {\n    text-align: center;\n    padding: 16px;\n}\n\n.stat-value {\n    font-size: 28px;\n    font-weight: 800;\n    color: var(--primary);\n}\n\n.stat-value.success { color: var(--success); }\n.stat-value.warning { color: var(--warning); }\n.stat-value.danger { color: var(--danger); }\n\n.stat-label {\n    font-size: 12px;\n    color: var(--text-tertiary);\n    margin-top: 4px;\n}\n\n/* 标签 */\n.tag {\n    display: inline-block;\n    padding: 2px 10px;\n    border-radius: 4px;\n    font-size: 12px;\n    font-weight: 500;\n    margin-right: 6px;\n}\n\n.tag-blue { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }\n.tag-green { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }\n.tag-orange { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }\n.tag-red { background: #fff1f0; color: #f5222d; border: 1px solid #ffa39e; }\n.tag-purple { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }\n\n/* 技巧卡片 */\n.tip-card {\n    background: linear-gradient(135deg, #f8fbff 0%, #eef5ff 100%);\n    border: 1px solid #d6e8ff;\n    border-radius: var(--radius-sm);\n    padding: 14px 16px;\n    margin-bottom: 10px;\n    position: relative;\n}\n\n.tip-card .tip-tag {\n    position: absolute;\n    top: -1px;\n    left: -1px;\n    background: var(--primary);\n    color: #fff;\n    font-size: 11px;\n    padding: 2px 10px;\n    border-radius: var(--radius-sm) 0 var(--radius-sm) 0;\n}\n\n.tip-title {\n    font-weight: 600;\n    font-size: 14px;\n    color: var(--primary-dark);\n    margin-bottom: 6px;\n    margin-top: 8px;\n}\n\n.tip-content {\n    font-size: 13px;\n    color: var(--text-secondary);\n    line-height: 1.7;\n}\n\n/* 知识条目 */\n.knowledge-item {\n    padding: 12px 0;\n    border-bottom: 1px dashed var(--border);\n}\n\n.knowledge-item:last-child { border-bottom: none; }\n\n.knowledge-item h4 {\n    font-size: 14px;\n    color: var(--primary-dark);\n    margin-bottom: 6px;\n}\n\n.knowledge-item p {\n    font-size: 13px;\n    color: var(--text-secondary);\n    line-height: 1.7;\n}\n\n/* 每日推送 */\n.daily-push {\n    background: linear-gradient(135deg, #fff9f0 0%, #fff3e6 100%);\n    border: 1px solid #ffe7c0;\n    border-radius: var(--radius);\n    padding: 20px 24px;\n    margin-bottom: 16px;\n    position: relative;\n    overflow: hidden;\n}\n\n.daily-push::before {\n    content: \'\';\n    position: absolute;\n    top: 0; right: 0;\n    width: 120px; height: 120px;\n    background: radial-gradient(circle, rgba(255,184,77,0.15), transparent);\n    border-radius: 50%;\n}\n\n.daily-push .push-header {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    margin-bottom: 10px;\n    position: relative;\n}\n\n.daily-push .push-date {\n    font-size: 13px;\n    color: var(--text-tertiary);\n}\n\n.daily-push .push-title {\n    font-size: 17px;\n    font-weight: 700;\n    color: #d46b08;\n    margin-bottom: 8px;\n    position: relative;\n}\n\n.daily-push .push-content {\n    font-size: 14px;\n    color: var(--text);\n    line-height: 1.8;\n    position: relative;\n}\n\n/* 励志卡片 */\n.motivation-card {\n    text-align: center;\n    padding: 40px 30px;\n    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n    color: #fff;\n    border-radius: var(--radius);\n    box-shadow: 0 8px 32px rgba(102,126,234,0.3);\n    position: relative;\n    overflow: hidden;\n}\n\n.motivation-card::before {\n    content: \'"\';\n    position: absolute;\n    top: -20px;\n    left: 20px;\n    font-size: 120px;\n    opacity: 0.15;\n    font-family: Georgia, serif;\n}\n\n.motivation-text {\n    font-size: 22px;\n    font-weight: 600;\n    line-height: 1.8;\n    margin-bottom: 16px;\n    position: relative;\n}\n\n.motivation-author {\n    font-size: 14px;\n    opacity: 0.8;\n}\n\n/* 表格 */\n.data-table {\n    width: 100%;\n    border-collapse: collapse;\n    font-size: 13px;\n}\n\n.data-table th {\n    text-align: left;\n    padding: 10px 12px;\n    background: #fafafa;\n    color: var(--text-secondary);\n    font-weight: 600;\n    border-bottom: 2px solid var(--border);\n}\n\n.data-table td {\n    padding: 10px 12px;\n    border-bottom: 1px solid var(--border);\n}\n\n.data-table tr:hover td { background: #fafcff; }\n\n/* 模块卡片 */\n.module-card {\n    cursor: pointer;\n    transition: transform 0.2s, box-shadow 0.2s;\n}\n\n.module-card:hover {\n    transform: translateY(-2px);\n    box-shadow: var(--shadow-lg);\n}\n\n.module-icon {\n    width: 48px;\n    height: 48px;\n    border-radius: 12px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 24px;\n    margin-bottom: 10px;\n}\n\n/* 公文格式 */\n.doc-format {\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    overflow: hidden;\n    margin-bottom: 12px;\n}\n\n.doc-format-header {\n    background: var(--primary-bg);\n    padding: 10px 14px;\n    font-weight: 600;\n    color: var(--primary-dark);\n    font-size: 14px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n}\n\n.doc-format-body {\n    padding: 14px;\n    font-size: 13px;\n    line-height: 1.8;\n    color: var(--text-secondary);\n}\n\n.doc-format-body .key-point {\n    color: var(--primary);\n    font-weight: 600;\n}\n\n/* 真题卡片 */\n.question-card {\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    overflow: hidden;\n    margin-bottom: 14px;\n}\n\n.question-header {\n    background: #f5f7fa;\n    padding: 10px 14px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    font-size: 13px;\n}\n\n.question-body {\n    padding: 14px;\n}\n\n.question-title {\n    font-size: 15px;\n    font-weight: 600;\n    color: var(--text);\n    margin-bottom: 10px;\n    line-height: 1.7;\n}\n\n.question-answer {\n    background: #f0f9eb;\n    border-left: 3px solid var(--success);\n    padding: 12px 14px;\n    border-radius: 0 var(--radius-sm) 0 0;\n    font-size: 13px;\n    color: var(--text-secondary);\n    line-height: 1.8;\n    margin-top: 10px;\n}\n\n/* 时政条目 */\n.hot-item {\n    display: flex;\n    gap: 12px;\n    padding: 14px 0;\n    border-bottom: 1px solid var(--border);\n}\n\n.hot-item:last-child { border-bottom: none; }\n\n.hot-number {\n    width: 28px;\n    height: 28px;\n    border-radius: 6px;\n    background: var(--primary);\n    color: #fff;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 13px;\n    font-weight: 700;\n    flex-shrink: 0;\n}\n\n.hot-content h4 {\n    font-size: 14px;\n    color: var(--text);\n    margin-bottom: 4px;\n}\n\n.hot-content p {\n    font-size: 13px;\n    color: var(--text-secondary);\n    line-height: 1.6;\n}\n\n/* 模态框 */\n.modal-overlay {\n    display: none;\n    position: fixed;\n    top: 0; left: 0; right: 0; bottom: 0;\n    background: rgba(0,0,0,0.4);\n    z-index: 1000;\n    align-items: center;\n    justify-content: center;\n}\n\n.modal-overlay.active { display: flex; }\n\n.modal {\n    background: #fff;\n    border-radius: var(--radius);\n    padding: 24px;\n    width: 420px;\n    max-width: 90%;\n    box-shadow: var(--shadow-lg);\n}\n\n.modal-title {\n    font-size: 18px;\n    font-weight: 700;\n    margin-bottom: 16px;\n}\n\n/* Toast */\n.toast {\n    position: fixed;\n    bottom: 24px;\n    left: 50%;\n    transform: translateX(-50%);\n    background: var(--text);\n    color: #fff;\n    padding: 10px 24px;\n    border-radius: 24px;\n    font-size: 14px;\n    z-index: 2000;\n    opacity: 0;\n    transition: opacity 0.3s, transform 0.3s;\n    pointer-events: none;\n}\n\n.toast.show {\n    opacity: 0.9;\n    transform: translateX(-50%) translateY(-4px);\n}\n\n/* 滚动条 */\n::-webkit-scrollbar { width: 6px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }\n::-webkit-scrollbar-thumb:hover { background: #aaa; }\n\n/* 面试视频推荐 */\n.video-card {\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    overflow: hidden;\n    transition: box-shadow 0.3s;\n}\n\n.video-card:hover { box-shadow: var(--shadow-lg); }\n\n.video-thumb {\n    width: 100%;\n    height: 120px;\n    background: linear-gradient(135deg, var(--primary), var(--p -template-columns: 1fr; }\n    .checkin-stats { grid-template-columns: repeat(3, 1fr); }\n}\n</style>\n</head>\n<body>\n\n<!-- ============ 顶部倒计时栏 ============ -->\n<div class="top-bar">\n    <div class="logo">\n        <span class="icon">📚</span>\n        <span>考公专属工作台</span>\n    </div>\n    <div class="countdown-wrapper">\n        <div class="exam-switch">\n            <button class="active" onclick="switchExamType(\'guokao\')">国考</button>\n            <button onclick="switchExamType(\'shengkao\')">省考</button>\n        </div>\n        <div class="countdown-display" id="countdownDisplay">\n            <span class="label">距考试还有</span>\n            <span class="days" id="countdownDays">124</span>\n            <span class="unit">天</span>\n        </div>\n        <span class="date-setting" onclick="openDateModal()">设置日期</span>\n        <span class="date-setting-mobile" onclick="openDateModal()">设置</span>\n    </div>\n</div>\n\n<!-- ============ 主布局 ============ -->\n<div class="main-layout">\n    <!-- 左侧导航 -->\n    <div class="sidebar" id="sidebar">\n        <div class="nav-section">\n            <div class="nav-section-title">核心功能</div>\n            <div class="nav-item active" data-target="exam-info" onclick="switchSection(\'exam-info\', this)">\n                <span class="nav-icon">📋</span><span class="nav-text">考试信息</span>\n            </div>\n        </div>\n        <div class="nav-section">\n            <div class="nav-section-title">行测学习</div>\n            <div class="nav-item" data-target="xingce-yanyu" onclick="switchSection(\'xingce-yanyu\', this)">\n                <span class="nav-icon">📖</span><span class="nav-text">言语理解</span>\n            </div>\n            <div class="nav-item" data-target="xingce-shuliang" onclick="switchSection(\'xingce-shuliang\', this)">\n                <span class="nav-icon">🔢</span><span class="nav-text">数量关系</span>\n            </div>\n            <div class="nav-item" data-target="xingce-panduan" onclick="switchSection(\'xi span class="nav-icon">🔥</span><span class="nav-text">热点剖析</span>\n            </div>\n        </div>\n        <div class="nav-section">\n            <div class="nav-item" data-target="chicken-soup" onclick="switchSection(\'chicken-soup\', this)">\n                <span class="nav-icon">💪</span><span class="nav-text">心灵鸡汤</span>\n            </div>\n        </div>\n    </div>\n\n    <!-- 右侧内容区 -->\n    <div class="content-area" id="contentArea">\n        <div class="module-hero" style="background:linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);box-shadow:0 6px 20px rgba(45,108,223,0.25);">\n            <div class="module-hero-header">\n                <div>\n                    <div class="module-hero-title">📋 国家公务员考试</div>\n                    <div class="module-hero-sub">国家公务员考试 · 笔试日期：2026-11-29</div>\n                </div>\n                <button class="module-hero-btn" onclick="openDateModal()">设置日期</button>\n            </div>\n            <div class="module-hero-progress">\n                <div class="progress-label">\n                    <span>距笔试还有</span>\n                    <span style="font-size:20px;font-weight:800;">124 天</span>\n                </div>\n                <div class="progress-bar"><div class="fill" style="width:66.02739726027397%;"></div></div>\n            </div>\n        </div>\n\n        \n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>智能岗位推荐</div>\n        <div class="subtitle-hint">填写你的信息 · 系统智能匹配适合的岗位</div>\n        <div class="card-white">\n            <div class="checkin-input-row" style="grid-template-columns:repeat(2,1fr);gap:10px;">\n                <div class="form-group">\n                    <label class="form-label">学历</label>\n                    <select class="form-select" id="rec_edu">\n                        <option value="">请选择</option>\n                        <option value="高中">高中/                        <option value="计算机类">计算机类</option>\n                        <option value="中文类">中文/新闻类</option>\n                        <option value="管理类">管理类</option>\n                        <option value="理工类">理工类</option>\n                        <option value="医学类">医学类</option>\n                        <option value="教育类">教育类</option>\n                        <option value="其他">其他</option>\n                    </select>\n                </div>\n                <div class="form-group">\n                    <label class="form-label">意向地区</label>\n                    <select class="form-select" id="rec_region">\n                        <option value="">不限</option>\n                        <option value="中央">中央机关</option>\n                        <option value="省级">省级机关</option>\n                        <option value="市级">市级机关</option>\n                        <option value="县级">县级机关</option>\n                        <option value="乡镇">乡镇机关</option>\n                    </select>\n                </div>\n            </div>\n            <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="recommendPositions()">智能推荐岗位</button>\n            <div id="recommendResult" style="margin-top:14px;"></div>\n        </div>\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>考试时间轴</div>\n        <div class="subtitle-hint">从公告到录用 · 全流程节点</div>\n        <div class="card-white">\n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">📢</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">发布公告及职位表</h4>\n                <p style="font-size:12px;">每年10月中旬</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">✍</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">网上报名（提交报考申请）</h4>\n                <p style="font-size:12px;">10月中下旬</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">🔍</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">查询资格审查结果</h4>\n                <p style="font-size:12px;">10月下旬-11月初</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">💳</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">查询报名序号、缴费确认</h4>\n                <p style="font-size:12px;">11月初</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">🖨</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">打印准考证</h4>\n                <p style="font-size:12px;">11月底-12月初</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">✏️</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">笔试：行测（上午）+申论（下午）</h4>\n                <p style="font-size:12px;">11月下旬（通常第四个周日）</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">📊</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">笔试成绩查询</h4>\n                <p style="font-size:12px;">次年1月</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">🎤</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">面试及专业科目考试</h4>\n                <p style="font-size:12px;">次年2-3月</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">🏥</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">体检与考察</h4>\n                <p style="font-size:12px;">次年3-4月</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">🎉</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">公示拟录用人员</h4>\n                <p style="font-size:12px;">次年4-5月</p>\n            </div>\n        </div>\n    </div>\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>备考时间规划</div>\n        <div class="subtitle-hint">分阶段备考 · 科学安排进度</div>\n        <div class="card-white">\n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">1</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">基础阶段（3-6月）</h4>\n                <p style="font-size:13px;color:var(--text-secondary);margin-top:2px;">系统学习行测申论基础知识，建立知识框架</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">2</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">强化阶段（7-9月）</h4>\n                <p style="font-size:13px;color:var(--text-secondary);margin-top:2px;">分模块刷题，攻克薄弱环节，总结做题方法</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">3</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">冲刺阶段（10-11月）</h4>\n                <p style="font-size:13px;color:var(--text-secondary);margin-top:2px;">全真模拟，套题训练，考前押题，调整状态</p>\n            </div>\n        </div>\n    \n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">4</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">面试阶段（次年1-3月）</h4>\n                <p style="font-size:13px;color:var(--text-secondary);margin-top:2px;">出成绩后立即开始面试备考，练习表达</p>\n            </div>\n        </div>\n    </div>\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>常见问题FAQ</div>\n        <div class="subtitle-hint">考生最关心的问题解答</div>\n        \n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-blue">FAQ 1</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">国考和省考可以同时报考吗？</div>\n                <div class="question-answer">可以。国考和省考时间一般不冲突，建议同时报考增加上岸机会。</div>\n            </div>\n        </div>\n    \n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-blue">FAQ 2</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">应届生身份怎么认定？</div>\n                <div class="question-answer">毕业2年内未缴纳社保的毕业生可保留应届身份，国考中很多岗位仅限应届。</div>\n            </div>\n        </div>\n    \n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-blue">FAQ 3</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">报名时选岗有什么技巧？</div>\n                <div class="question-answer">尽量选择限制条件多的岗位（专业、学历、政治面貌、基层经历等），限制越多竞争越小。</div>\n            </div>\n        </div>\n    \n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-blue">FAQ 4</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">国考行测副省级和地市级有什么区别？</div>\n                <div class="question-answer">副省级题量135题，地市级130题；副省级难度更大，申论考查维度不同。</div>\n            </div>\n        </div>\n    \n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-blue">FAQ 5</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">笔试多少分能进面试？</div>\n                <div class="question-answer">因岗位而异，热门岗位需130+，冷门岗位110+也可能入围，看进面分数线。</div>\n            </div>\n        </div>\n    \n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-blue">FAQ 6</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">资格审查没通过怎么办？</div>\n                <div class="question-answer">在报名截止前改报其他岗位。建议尽早报名，留出审核时间。</div>\n            </div>\n        </div>\n    \n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>备考提示</div>\n        \n        <div class="tip-card">\n            <span class="tip-tag">💡</span>\n            <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">国考岗位分为中央机关及直属机构，竞争激烈但平台高</p>\n        </div>\n    \n        <div class="tip-card">\n            <span class="tip-tag">💡</span>\n            <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">应届生身份在国考中优势明显，很多岗位仅限应届</p>\n        </div>\n    \n        <div class="tip-card">\n            <span class="tip-tag">💡</span>\n            <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">中央机关申论分为副省级和地市级，难度不同</p>\n        </div>\n    \n        <div class="tip-card">\n            <span class="tip-tag">💡</span>\n            <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">专业课考试：部分岗位需加试外语、公安等专业科目</p>\n        </div>\n    \n        <div class="tip-card">\n            <span class="tip-tag">💡</span>\n            <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">报名时关注进面分数线和报录比，理性选择岗位</p>\n        </div>\n    \n        <div class="tip-card">\n            <span class="tip-tag">💡</span>\n            <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">准考证打印后第一时间订酒店，考点附近酒店紧张</p>\n        </div>\n    \n    </div>\n</div>\n\n<!-- 日期设置模态框 -->\n<div class="modal-overlay" id="dateModal">\n    <div class="modal">\n        <div class="modal-title">📅 设置考试日期</div>\n        <div class="form-group">\n            <label class="form-label" id="dateModalLabel">国考笔试日期</label>\n            <input type="date" class="form-input" id="dateInput">\n        </div>\n        <div class="flex gap-8 mt-16">\n            <button class="btn btn-primary" onclick="saveExamDate()">保存</button>\n            <button class="btn btn-outline" onclick="closeDateModal()">取消</button>\n        </div>\n    </div>\n</div>\n\n<!-- 题型训练弹窗 -->\n<div class="modal-overlay" id="trainingModal">\n    <div class="modal" style="width:560px;max-height:85vh;overflow-y:auto;">\n        <div id="trainingModalBody"></div>\n    </div>\n</div>\n\n<!-- Toast -->\n<div class="toast" id="toast"></div>\n\n<script>\n// ==================== 数据存储层 ====================\nconst Store = {\n    get(key, defaultVal) {\n        try {\n            const v = localStorage.getItem(\'kaogong_\' + key);\n            return v ? JSON.parse(v) : (defaultVal || {});\n        } catch(e) { return defaultVal || {}; }\n    },\n    set(key, val) {\n        localStorage.setItem(\'kaogong_\' + key, JSON.stringify(val));\n    }\n};\n\n// ==================== 考试日期配置 ====================\nconst EXAM_DATES = {\n    guokao: { name: \'国考\', defaultDate: \'2026-11-29\', label: \'国家公务员考试\' },\n    shengkao: { name: \'省考\', defaultDate: \'2026-03-14\', label: \'省级公务员考试\' }\n};\n\nlet currentExamType = \'guokao\';\n\n// ==================== 倒计时 ====================\nfunction updateCountdown() {\n    const dates = Store.get(\'examDates\', {});\n    const date = dates[currentExamType] || EXAM_DATES[currentExamType].defaultDate;\n    const target = new Date(date);\n    const now = new Date();\n    now.setHours(0,0,0,0);\n    target.setHours(0,0,0,0);\n    const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));\n    document.getElementById(\'countdownDays\').textContent = diff >= 0 ? diff : \'已过期\';\n}\n\nfunction switchExamType(type) {\n    currentExamType = type;\n    document.querySelectorAll(\'.exam-switch button\').forEach((btn, i) => {\n        btn.classList.toggle(\'active\', (type === \'guokao\' && i === 0) || (type === \'shengkao\' && i === 1));\n    });\n    updateCountdown();\n    // 如果当前在考试信息页，刷新内容\n    const activeNav = document.querySelector(\'.nav-item.active\');\n    if (activeNav && activeNav.dataset.target === \'exam-info\') {\n        renderExamInfo();\n    }\n    showToast(\'已切换到\' + EXAM_DATES[type].name);\n}\n\nfunction openDateModal() {\n    const dates = Store.get(\'examDates\', {});\n    const date = dates[currentExamType] || EXAM_DATES[currentExamType].defaultDate;\n    document.getElementById(\'dateInput\').value = date;\n    document.getElementById(\'dateModalLabel\').textContent = EXAM_DATES[currentExamType].name + \'笔试日期\';\n    document.getElementById(\'dateModal\').classList.add(\'active\');\n}\n\nfunction closeDateModal() {\n    document.getElementById(\'dateModal\').classList.remove(\'active\');\n}\n\nfunction saveExamDate() {\n    const date = document.getElementById(\'dateInput\').value;\n    if (!date) { showToast(\'请选择日期\'); return; }\n    const dates = Store.get(\'examDates\', {});\n    dates[currentExamType] = date;\n    Store.set(\'examDates\', dates);\n    closeDateModal();\n    updateCountdown();\n    showToast(\'日期已保存\');\n}\n\n// ==================== Toast ====================\nfunction showToast(msg) {\n    const t = document.getElementById(\'toast\');\n    t.textContent = msg;\n    t.classList.add(\'show\');\n    setTimeout(() => t.classList.remove(\'show\'), 2000);\n}\n\n// ==================== 内容区切换 ====================\nfunction switchSection(target, navEl) {\n    document.querySelectorAll(\'.nav-item\').forEach(n => n.classList.remove(\'active\'));\n    if (navEl) navEl.classList.add(\'active\');\n\n    const area = document.getElementById(\'contentArea\');\n    area.innerHTML = \'\';\n\n    const renderers = {\n        \'exam-info\': renderExamInfo,\n        \'xingce-yanyu\': () => renderXingceModule(\'yanyu\'),\n        \'xingce-shuliang\': () => renderXingceModule(\'shuliang\'),\n        \'xingce-panduan\': () => renderXingceModule(\'panduan\'),\n        \'xingce-ziliao\': () => renderXingceModule(\'ziliao\'),\n        \'xingce-changshi\': () => renderXingceModule(\'changshi\'),\n        \'shenlun-shizheng\': renderShenlunShizheng,\n        \'shenlun-zhenti\': renderShenlunZhenti,\n        \'shenlun-gongwen\': renderShenlunGongwen,\n        \'mianshi-lilun\': renderMianshiLilun,\n        \'mianshi-sucai\': renderMianshiSucai,\n        \'mianshi-redian\': renderMianshiRedian,\n        \'chicken-soup\': renderChickenSoup\n    };\n\n    if (renderers[target]) renderers[target]();\n}\n\n// ==================== 日期工具 ====================\nfunction getTodayStr() {\n    const d = new Date();\n    return d.getFullYear() + \'-\' + String(d.getMonth()+1).padStart(2,\'0\') + \'-\' + String(d.getDate()).padStart(2,\'0\');\n}\n\nfunction getDayOfYear() {\n    const now = new Date();\n    const start = new Date(now.getFullYear(), 0, 0);\n    return Math.floor((now - start) / (1000 * 60 * 60 * 24));\n}\n\n// 用于内容轮换：根据天数取模获取内容\nfunction getDailyContent(arr) {\n    const day = getDayOfYear();\n    return arr[day % arr.length];\n}\n\nfunction getDailyContents(arr, count) {\n    const day = getDayOfYear();\n    const result = [];\n    for (let i = 0; i < count; i++) {\n        result.push(arr[(day + i) % arr.length]);\n    }\n    return result;\n}\n</script>\n\n<!-- ==================== 内容库：考试信息 ==================== -->\n<script>\nconst EXAM_INFO = {\n    guokao: {\n        title: \'国家公务员考试\',\n        timeline: [\n            { date: \'每年10月中旬\', event: \'发布公告及职位表\', icon: \'📢\' },\n            { date: \'10月中下旬\', event: \'网上报名（提交报考申请）\', ic  \'网络购物促进了经济发展\', \'网络购物存在假冒伪劣问题\'],\n                answer: 1,\n                analysis: \'文段先讲网络购物的便利，再用"然而"转折指出问题，最后用"因此"引出结论——需要规范市场、保障消费者权益。B选项是对中心句的同义替换。\'\n            }\n        ],\n        theory: [\n            { title: \'选词填空\', content: \'考查语境分析和词语辨析。核心方法：找准语境提示词（转折、递进、并列、解释），结合词义差异进行选择。重点关注近义词的语意轻重、感情色彩、搭配习惯。\' },\n            { title: \'片段阅读\', content: \'主旨概括题找中心句（关联词引导），细节判断题对照原文排除。意图判断题在主旨基础上合理推断。标题填入题需吸引眼球且概括全面。\' },\n            { title: \'语句表达\', content: \'语句排序找首尾句和关联词，语句衔接注意话题一致和逻辑连贯。词句理解题需结合上下文语境。\' }\n        ],\n        tips: [\n            { title: \'语境分析法\', content: \'选词填空不要只看空格，要关注空格前后的逻辑关系词：但是、然而（转折），而且、甚至（递进），同时、也（并列），即、也就是说（解释）。\' },\n            { title: \'主体排除法\', content: \'片段阅读中，选项主体与文段主体不一致的直接排除。主体词是文段论述的核心对象。\' },\n            { title: \'关联词定位法\', content: \'重点关注"但是、因此、总之、也就是说"等关联词，这些词后面往往是文段重点。\' },\n            { title: \'选项对比法\', content: \'选词填空遇到犹豫时，将各选项代入空格，读起来最通顺、最符合语境的为最佳。\' },\n            { title: \'主题词筛选\', content: \'正确选项通常包含文段的主题词，不含主题词的选项优先排除。\' },\n            { title: \'行文脉络法\', content: \'分析文段结构：总分、分总、总分总、转折、并列。找出文段的主干结构，确定重点。\' },\n            { title: \'细节排除法\', content: \'细节判断题选项与原文逐一比对，注意偷换概念、无中生有、以偏概全、绝对化表述。\' },\n            { title: \'排序首尾句\', content: \'语句排序题，首句通常是引入性或定义性句子，尾句通常是总结性或结论性句子。\' },\n            { title: \'代词指代\', content: \'语句衔接题注意代词的指代对象，确保前后文逻辑通顺，代词有明确的指代。\' },\n            { title: \'时间分配\', content: \'言语理解建议每题平均不超过50秒，难题不要死磕，先做有把握的。\' }\n        ]\n    },\n    shuliang: {\n        name: \'数量关系\',\n        icon: \'🔢\',\n        color: \'#fff7e6\',\n        iconBg: \'#fa8c16\',\n        desc: \'数学运算、数字推理\',\n        topics: [\n            { title: \'工程问题\', must: true, desc: \'合作完工·交替施工·水管问题\' },\n            { title: \'行程问题\', must: true, desc: \'相遇追及·流水行船·环形问题\' },\n            { title: \'利润问题\', must: false, desc: \'成本定价·打折出售·分段计费\' },\n            { title: \'排列组合\', must: false, desc: \'排列有序·组合无序·分类分步\' },\n            { title: \'几何问题\', must: false, desc: \'平面几何·立体几何·最值问题\' },\n            { title: \'数字推理\', must: true, desc: \'等差等比·递推规律·多级数列\' }\n        ],\n        recite: [\n            { title: \'工程问题：总量=效率×时间（特值法）\', tag: \'必背\' },\n            { title: \'行程问题：路程=速度×时间\', tag: \'高频\' },\n            { title: \'利润公式：利润=售价-成本\', tag: \'高频\' },\n            { title: \'排列组合：排列有序，组合无序\', tag: \'基础\' },\n            { title: \'容斥原理：两集合/三集合公式\', tag: \'必背\' },\n            { title: \'数字推理：多级做差法\', tag: \'基础\' }\n        ],\n        quiz: [\n            { question: \'一项工程，甲单独做需要10天完成，乙单独做需要15天完成。两人合作完成这项工程需要多少天？\', options: [\'5天\', \'6天\', \'7天\', \'8天\'], answer: 1, analysis: \'设工作总量为10和15的最小公倍数30。甲效率=30÷10=3，乙效率=30÷15=2。合作效率=3+2=5，所需时间=30÷5=6天。\' },\n            { question: \'某商品进价为80元，按20%的利润定价，再按定价打8折出售，实际利润率为多少？\', options: [\'2%\', \'4%\', \'8%\', \'12%\'], answer: 1, analysis: \'定价=80×(1+20%)=96元；售价=96×0.8=76.8元；利润=76.8-80=-3.2元；利润率=-3.2÷80=-4%。注意是亏损4%。\' },\n            { question: \'从5名男生和4名女生中选出3人参加志愿者活动，要求至少有1名女生，有多少种选法？\', options: [\'74种\', \'84种\', \'94种\', \'104种\'], answer: 0, analysis: \'总选法=C(9,3)=84；全是男生的选法=C(5,3)=10；所以至少有1名女生的选法=84-10=74种。\' }\n        ],\n        theory: [\n            { title: \'数学运算核心考点\', content: \'工程问题、行程问题、利润问题、排列组合、概率问题、容斥原理、最值问题、几何问题、年龄问题、日期问题等。\' },\n            { title: \'解题核心方法\', content: \'方程法（设未知数列方程）、代入排除法、特值法（设特殊值简化计算）、比例法、整除特性法。\' },\n            { title: \'数字推理规律\', content: \'等差数列、等比数列、递推数列（和递推、积递推）、幂次数列、分组数列、分数数列、多级数列。\' }\n        ],\n        tips: [\n            { title: \'代入排除法\', content: \'将选项代入题干验证，是最快的方法之一。尤其适用于年龄问题、余数问题等。\' },\n            { title: \'特值法\', content: \'遇到比例、分数关系时，设最简值为特值。如"甲是乙的3/5"，设乙为5、甲为3，简化计算。\' },\n            { title: \'工程问题特值法\', content: \'工程问题设工作总量为时间的最小公倍数，则效率=总量÷时间，计算最简便。\' },\n            { title: \'行程问题比例法\', content: \'时间相同，路程与速度成正比；速度相同，路程与时间成正比；路程相同，速度与时间成反比。\' },\n            { title: \'利润问题公式\', content: \'利润=售价-成本；利润率=利润÷成本×100%；打折后售价=原价×折扣。熟记公式直接代入。\' },\n            { title: \'排列组合区分\', content: \'排列有顺序（ABC≠BAC），组合无顺序。注意"至少""至多"用间接法更简便。\' },\n            { title: \'容斥原理公式\', content: \'两集合：A∪B=A+B-A∩B；三集合：总数=A+B+C-（两者交集）+三者交集。\' },\n            { title: \'整除特性\', content: \'遇到"每""平均""整除"等关键词，利用整除特性排除选项。如3的倍数各位数字之和能被3整除。\' },\n            { title: \'数字推理多级\', content: \'看不出规律就做差（后项减前项），一次差不行就二次差，通常不超过三级。\' },\n            { title: \'策略性放弃\', content: \'数量关系是行测最难部分，建议先做会的，难题果断蒙（统一蒙B或C），不浪费时间。\' }\n        ]\n    },\n    panduan: {\n        name: \'判断推理\',\n        icon: \'🧩\',\n        color: \'#f9f0ff\',\n        iconBg: \'#722ed1\',\n        desc: \'图形推理、定义判断、类比推理、逻辑判断\',\n        topics: [\n            { title: \'图形推理\', must: true, desc: \'数量规律·位置变化·样式运算·空间重构\' },\n            { title: \'定义判断\', must: true, desc: \'单定义·多定义·属于/不属于\' },\n            { title: \'类比推理\', must: false, desc: \'逻辑关系·言语关系·常识关系\' },\n            { title: \'逻辑判断\', must: true, desc: \'翻译推理·真假推理·加强削弱\' },\n            { title: \'事件排序\', must: false, desc: \'首尾排序·逻辑排序\' }\n        ],\n        recite: [\n            { title: \'图形推理：数面线点角素\', tag: \'必背\' },\n            { title: \'定义判断：要素提取法\', tag: \'高频\' },\n            { title: \'翻译推理：充分→前推后\', tag: \'必背\' },\n            { title: \'削弱加强：找论点→看论据\', tag: \'高频\' },\n            { title: \'类比推理：造句法判断关系\', tag: \'基础\' },\n            { title: \'真假推理：找矛盾→绕开→回\', tag: \'基础\' }\n        ],\n        quiz: [\n            { question: \'所有甲都是乙，有些乙是丙，则下列哪项一定正确？\', options: [\'所有甲都是丙\', \'有些甲是丙\', \'有些甲不是丙\', \'无法确定甲和丙的关系\'], answer: 3, analysis: \'所有甲→乙，有些乙→丙，但"有些乙是丙"中的乙不一定包含甲那部分，无法确定甲和丙的关系。\' },\n            { question: \'请选择填入问号处最合适的图形：\', options: [\'A（三角形\', \'B（圆形）\', \'C（方形）\', \'D（五角星）\'], answer: 2, analysis: \'图形推理题，观察前几个图形的线条数递增规律，选择符合规律的那个。\' }\n        ],\n        theory: [\n            { title: \'图形推理\', content: \'考查规律：数量类（点、线、面、素）、位置类（平移、旋转、翻转）、样式类（叠加、相减、求同、求异）、属性类（对称、曲直、封闭）、空间重构（折纸盒）。\' },\n            { title: \'定义判断\', content: \'抓住定义的核心要素（主体、客体、条件、结果），将选项与定义要素逐一比对。注意"属于/不属于"的问法。\' },\n            { title: \'类比推理\', content: \'分析词项间逻辑关系：全同、包含、交叉、并列关系；条件、因果、顺承关系；近义、反义关系。注意词性和感情色彩。\' },\n            { title: \'逻辑判断\', content: \'必然性推理（翻译推理、真假推理）、可能性推理（加强、削弱、前提假设、解释评价）。核心：掌握充分必要条件推理规则。\' }\n        ],\n        tips: [\n            { title: \'图形数数法\', content: \'先数点、线、面的数量，看是否有递增递减或恒定规律。最常见的考点。\' },\n            { title: \'图形对称性\', content: \'看图形是否轴对称或中心对称，对称轴数量和方向也是常考点。\' },\n            { title: \'图形位置变化\', content: \'元素位置有规律移动：顺时针/逆时针旋转、上下左右平移。注意移动步数。\' },\n            { title: \'样式运算\', content: \'两图叠加，看公共部分（求同）或不同部分（求异）。黑白叠加：黑+黑=白，白+白=白，黑+白=黑。\' },\n            { title: \'定义要素法\', content: \'定义判断：将定义拆解为"主体+客体+方式+目的+条件"，选项必须全部符合。\' },\n            { title: \'定义排除法\', content: \'定义判断先看问法"属于/不属于"，不符合任一要素即排除。\' },\n            { title: \'类比造句法\', content: \'类比推理用造句法判断关系：A是B的...，再看选项哪个关系一致。注意前后顺序。\' },\n            { title: \'翻译推理公式\', content: \'充分条件→（前推后）：A→B；必要条件（后推前）：B→A。逆否命题等价原命题：非B→非A。\' },\n            { title: \'削弱加强找论据\', content: \'削弱/加强题，先找论点，再看论据。削弱：否定论据、切断联系、另有他因。加强：补充论据、建立联系、排除他因。\' },\n            { title: \'真假话推理\', content: \'先找矛盾（必有一真一假），再绕开矛盾判断其他，最后回到矛盾确定真假。\' }\n        ]\n    },\n    ziliao: {\n        name: \'资料分析\',\n        icon: \'📊\',\n        color: \'#f6ffed\',\n        iconBg: \'#52c41a\',\n        desc: \'文字资料、表格资料、图形资料\',\n        topics: [\n            { title: \'增长率\', must: true, desc: \'同比增长·环比增长·年均增长\' },\n            { title: \'增长量\', must: true, desc: \'增长量计算·增长量比较\' },\n            { title: \'比重\', must: true, desc: \'现期比重·基期比重·比重变化\' },\n            { title: \'平均数\', must: false, desc: \'平均数计算·平均数变化\' },\n            { title: \'倍数\', must: false, desc: \'现期倍数·基期倍数·翻番\' },\n            { title: \'综合分析\', must: true, desc: \'多材料综合·数据找取·计算\' }\n        ],\n        recite: [\n            { title: \'增长率=(现期-基期)÷基期\', tag: \'必背\' },\n            { title: \'基期值=现期÷(1+增长率)\', tag: \'高频\' },\n            { title: \'比重=部分÷整体\', tag: \'高频\' },\n            { title: \'首数法：选项首位不同直接算\', tag: \'必背\' },\n            { title: \'特征数字法：1/2≈50%等\', tag: \'基础\' },\n            { title: \'同比vs环比区别\', tag: \'基础\' }\n        ],\n        quiz: [\n            { question: \'2025年甘肃GDP为X亿元，2024年为Y亿元。同比增长率计算公式为：\', options: [\'(X-Y)/Y\', \'(X-Y)/X\', \'X/Y\', \'Y/X\'], answer: 0, analysis: \'增长率=(现期值-基期值)÷基期值=(X-Y)÷Y。\' },\n            { question: \'某省2025年第三产业增加值占GDP比重为45%，较2024年提高2个百分点。则2024年比重为：\', options: [\'43%\', \'44%\', \'46%\', \'47%\'], answer: 0, analysis: \'2025年比重45%，较2024年提高2个百分点，说明2024年比重=45%-2%=43%。\' },\n            { question: \'2025年某企业产值为120亿元，同比增长20%。则2024年产值约为多少亿元？\', options: [\'90亿元\', \'96亿元\', \'100亿元\', \'110亿元\'], answer: 2, analysis: \'基期值=现期值÷(1+增长率)=120÷(1+20%)=120÷1.2=100亿元。\' }\n        ],\n        theory: [\n            { title: \'核心概念\', content: \'增长量、增长率、比重、倍数、平均数。掌握每个概念的定义、公式和变形。\' },\n            { title: \'速算方法\', content: \'首数法、尾数法、特征数字法、有效数字法、同位比较法。根据选项差距选择精度。\' },\n            { title: \'阅读技巧\', content: \'先看材料结构和关键词，快速定位数据。注意时间、单位、注释等细节。\' }\n        ],\n        tips: [\n            { title: \'增长率公式\', content: \'增长率=（现期值-基期值）÷基期值×100% = 增长量÷基期值×100%。记住变形：基期值=现期值÷（1+增长率）。\' },\n            { title: \'首数法\', content: \'选项首位不同时，直接算首位即可选答案。最常用的速算技巧。\' },\n            { title: \'特征数字法\', content: \'将百分数转化为简单分数计算：1/2≈50%, 1/3≈33.3%, 1/4≈25%, 1/5≈20%, 1/6≈16.7%, 1/8≈12.5%。\' },\n            { title: \'有效数字法\', content: \'选项差距大时，保留前2-3位有效数字计算，提高速度。\' },\n            { title: \'比重公式\', content: \'比重=部分÷整体×100%。比重变化：部分增长率>整体增长率，比重上升；反之下降。\' },\n            { title: \'平均数公式\', content: \'平均数=总量÷份数。注意区分"平均每"和"每平均"的问法。\' },\n            { title: \'增长量比较\', content: \'增长量=现期值-基期值。比较多个增长量时，可用现期值×增长率÷（1+增长率）快速估算。\' },\n            { title: \'倍数与翻番\', content: \'A是B的n倍=A÷B=n。翻一番=2倍，翻两番=4倍，翻n番=2的n次方倍。\' },\n            { title: \'时间单位陷阱\', content: \'注意"同比"（与去年同期比）和"环比"（与上一期比）的区别，以及月份和季度的转换。\' },\n            { title: \'先看选项再算\', content: \'做题前先看选项差距，差距大粗算，差距小精算。选项是计算精度的依据。\' }\n        ]\n    },\n    changshi: {\n        name: \'常识判断\',\n        icon: \'🌍\',\n        color: \'#fff1f0\',\n        iconBg: \'#f5222d\',\n        desc: \'政治常识、法律常识、科技人文、地理历史\',\n
