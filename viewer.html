<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考公专属工作台</title>
<style>
body { margin: 0; padding: 0; }
#iframe { width: 100vw; height: 100vh; border: none; }
.loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #666; }
</style>
</head>
<body>
<div class="loading" id="loading">加载中...</div>
<iframe id="iframe" style="display:none;"></iframe>
<script>
// 通过 jsDelivr CDN 加载 index.html（国内可访问）
const url = "https://cdn.jsdelivr.net/gh/ff312/kaogong-workbench@main/index.html";
fetch(url)
  .then(r => r.text())
  .then(html => {
    const iframe = document.getElementById('iframe');
    iframe.onload = () => {
      document.getElementById('loading').style.display = 'none';
      iframe.style.display = 'block';
    };
    iframe.srcdoc = html;
  })
  .catch(err => {
    document.getElementById('loading').innerHTML = '加载失败，请刷新重试<br>错误: ' + err.message;
  });
</script>
</body>
</html>
