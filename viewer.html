紧密，多关注新闻热点：重要会议、科技成就、纪念日等。\' },\n            { title: \'法律新规\', content: \'关注新颁布或修订的法律，如民法典、个人信息保护法等，是高频考点。\' },\n            { title: \'党史时间线\', content: \'熟记党史重要节点：1921建党、1927建军、1934-1936长征、1949建国、1978改革开放。\' },\n            { title: \'生活常识\', content: \'物理化学生物常识：光、声、电的基本原理；常见化学反应；人体器官和营养素。\' },\n            { title: \'诗词作者\', content: \'常考唐宋诗词作者及作品：李白（浪漫）、杜甫（现实）、苏轼、辛弃疾（豪放）、李清照（婉约）。\' },\n            { title: \'地理之最\', content: \'中国之最：最高峰珠穆朗玛峰、最长河流长江、最大盆地塔里木、最大高原青藏高原。\' },\n            { title: \'选项均分\', content: \'完全不会时，观察各题选项分布，行测整卷ABCD大致均分，可辅助猜测。\' },\n            { title: \'快速作答\', content: \'常识题知道就选，不知道就蒙，每题不超过30秒，为其他模块节省时间。\' }\n        ]\n    }\n};\n</script>\n\n<!-- ==================== 新模块数据：常识/数量/资料专用 ==================== -->\n<script>\n// 常识判断：题型入口\nconst CHANGSHI_TOPICS = [\n    { title: \'国情省情\', must: true, desc: \'中国地理·省级区划·人文风貌·生态环境\' },\n    { title: \'法律常识\', must: true, desc: \'宪法·行政法·民法典·事业单位条例\' },\n    { title: \'政治理论\', must: false, desc: \'二十大·党建·中特理论·时政热点\' },\n    { title: \'人文历史\', must: false, desc: \'中国历史名人·文化遗产·文学常识\' },\n    { title: \'科技地理\', must: false, desc: \'科技常识·自然地理·生活科学\' },\n    { title: \'事业单位常识\', must: true, desc: \'事业单位人事管理条例·职测综应\' }\n];\n\n// 常识判断：考点速记背诵\nconst CHANGSHI_RECITE = [\n    { title: \'中国国情：34省级行政区·56民族\', tag: \'必背\' },\n    { title: \'宪法基本制度与国家机构\', tag: \'高频\' },\n    { title: \'行政法：行政许可·处罚·复议·诉讼\', tag: \'高频\' },\n    { title: \'党的二十大报告核心要点\', tag: \'必背\' },\n    { title: \'中国古代史朝代更替与重大事件\', tag: \'基础\' },\n    { title: \'科技常识：物理化学生物高频考点\', tag: \'基础\' },\n    { title: \'事业单位人事管理条例要点\', tag: \'必背\' },\n    { title: \'中国世界文化遗产名录精选\', tag: \'拓展\' }\n];\n\n// 数量关系：考点 + 速记 + 真题\nconst SHULIANG_TOPICS = [\n    { name: \'工程问题\', formula: \'工作总量=效率×时间\' },\n    { name: \'行程问题\', formula: \'路程=速度×时间\' },\n    { name: \'利润问题\', formula: \'利润=售价-成本\' },\n    { name: \'排列组合\', formula: \'排列有序，组合无序\' },\n    { name: \'概率问题\', formula: \'概率=满足条件数÷总数\' },\n    { name: \'几何问题\', formula: \'面积/体积公式\' }\n];\n\nconst SHULIANG_QUIZ = [\n    {\n        question: \'一项工程，甲单独做需要10天完成，乙单独做需要15天完成。两人合作完成这项工程需要多少天？\',\n        options: [\'5天\', \'6天\', \'7天\', \'8天\'],\n        answer: 1,\n        analysis: \'设工作总量为10和15的最小公倍数30。甲效率=30÷10=3，乙效率=30÷15=2。合作效率=3+2=5，所需时间=30÷5=6天。\'\n    },\n    {\n        question: \'某商品进价为80元，按20%的利润定价，再按定价打8折出售，实际利润率为多少？\',\n        options: [\'2%\', \'4%\', \'8%\', \'12%\'],\n        answer: 1,\n        analysis: \'定价=80×(1+20%)=96元；售价=96×0.8=76.8元；利润=76.8-80=-3.2元；利润率=-3.2÷80=-4%。注意是亏损4%。\'\n    },\n    {\n        question: \'从5名男生和4名女生中选出3人参加志愿者活动，要求至少有1名女生，有多少种选法？\',\n        options: [\'74种\', \'84种\', \'94种\', \'104种\'],\n        answer: 0,\n        analysis: \'总选法=C(9,3)=84；全是男生的选法=C(5,3)=10；所以至少有1名女生的选法=84-10=74种。\'\n    }\n];\n\n// 资料分析：考点 + 速记 + 真题\nconst ZILIAO_TOPICS = [\n    { name: \'增长率\', formula: \'增长率=(现期-基期)÷基期\' },\n    { name: \'增长量\', formula: \'增长量=现期-基期=现期×增长率÷(1+增长率)\' },\n    { name: \'比重\', formula: \'比重=部分÷整体\' },\n    { name: \'平均数\', formula: \'平均数=总量÷份数\' },\n    { name: \'倍数\', formula: \'A是B的几倍=A÷B\' },\n    { name: \'翻番\', formula: \'翻n番=原来的2ⁿ倍\' }\n];\n\nconst ZILIAO_QUIZ = [\n    {\n        question: \'2025年甘肃GDP为X亿元，2024年为Y亿元。同比增长率计算公式为：\',\n        options: [\'(X-Y)/Y\', \'(X-Y)/X\', \'X/Y\', \'Y/X\'],\n        answer: 0,\n        analysis: \'增长率=(现期值-基期值)÷基期值=(X-Y)÷Y。\'\n    },\n    {\n        question: \'某省2025年第三产业增加值占GDP比重为45%，较2024年提高2个百分点。则2024年比重为：\',\n        options: [\'43%\', \'44%\', \'46%\', \'47%\'],\n        answer: 0,\n        analysis: \'2025年比重45%，较2024年提高2个百分点，说明2024年比重=45%-2%=43%。\'\n    },\n    {\n        question: \'2025年某企业产值为120亿元，同比增长20%。则2024年产值约为多少亿元？\',\n        options: [\'90亿元\', \'96亿元\', \'100亿元\', \'110亿元\'],\n        answer: 2,\n        analysis: \'基期值=现期值÷(1+增长率)=120÷(1+20%)=120÷1.2=100亿元。\'\n    }\n];\n</script>\n\n<!-- ==================== 内容库：申论 ==================== -->\n<script>\nconst SHENLUN_SHIZHENG = [\n    { keyword: \'新质生产力\', interpretation: \'新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效能、高质量特征，符合新发展理念的先进生产力质态。特点是创新，关键在质优，本质是先进生产力。要从科技创新、产业升级、人才支撑等方面发力推动。\' },\n    { keyword: \'中国式现代化\', interpretation: \'中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。五大特征：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。\' },\n    { keyword: \'高质量发展\', interpretation: \'高质量发展是全面建设社会主义现代化国家的首要任务。核心要求：完整、准确、全面贯彻新发展理念，加快构建新发展格局，坚持社会主义市场经济改革方向，推进高水平对外开放。\' },\n    { keyword: \'乡村振兴战略\', interpretation: \'乡村振兴是新时代"三农"工作总抓手。五大振兴：产业振兴、人才振兴、文化振兴、生态振兴、组织振兴。总要求：产业兴旺、生态宜居、乡风文明、治理有效、生活富裕。\' },\n    { keyword: \'共同富裕\', interpretation: \'共同富裕是中国特色社会主义的本质要求。不是同步富裕、同等富裕，而是分阶段、有差别的富裕。核心路径：做大做好"蛋糕"，再切好分好"蛋糕"，扩大中等收入群体，调节过高收入，促进社会公平。\' },\n    { keyword: \'全过程人民民主\', interpretation: \'全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。贯穿选举、协商、决策、管理、监督各个环节，确保人民当家作主。\' },\n    { keyword: \'生态文明建设\', interpretation: \'生态文明是人类社会进步的重大成果。核心理念：绿水青山就是金山银山；尊重自然、顺应自然、保护自然；节约优先、保护优先、自然恢复为主。推动绿色发展，建设美丽中国。\' },\n    { keyword: \'数字中国建设\', interpretation: \'数字中国是国家信息化发展的重要战略。包含数字政府、数字经济、数字社会、数字生态等方面。要加快新型数字基础设施建设，推进数据要素市场化，推动数字化转型赋能高质量发展。\' },\n    { keyword: \'科技创新驱动\', interpretation: \'科技是第一生产力，人才是第一资源，创新是第一动力。坚持科技自立自强，完善国家创新体系，强化国家战略科技力量，打好关键核心技术攻坚战，培养创新型人才。\' },\n    { keyword: \'文化自信自强\', interpretation: \'文化自信是更基础、更广泛、更深厚的自信。推进文化自信自强，铸就社会主义文化新辉煌。要建设具有强大凝聚力和引领力的社会主义意识形态，广泛践行社会主义核心价值观。\' },\n    { keyword: \'法治中国建设\', interpretation: \'全面依法治国是国家治理的一场深刻革命。坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设。科学立法、严格执法、公正司法、全民守法。\' },\n    { keyword: \'国家安全体系\', interpretation: \'国家安全是民族复兴的根基。总体国家安全观：以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事科技文化社会安全为保障。统筹发展和安全，增强维护国家安全能力。\' },\n    { keyword: \'人类命运共同体\', interpretation: \'构建人类命运共同体是中国为世界贡献的中国方案。核心理念：建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。推动共建"一带一路"高质量发展。\' },\n    { keyword: \'全面从严治党\', interpretation: \'全面从严治党永远在路上，党的自我革命永远在路上。以党的政治建设为统领，全面推进党的各项建设，反腐败斗争压倒性胜利不断巩固发展。\' },\n    { keyword: \'区域协调发展\', interpretation: \'深入实施区域协调发展战略，推进京津冀协同发展、长江经济带发展、粤港澳大湾区建设、长三角一体化发展、黄河流域生态保护和高质量发展。\' },\n    { keyword: \'碳达峰碳中和\', interpretation: \'"双碳"目标：2030年前实现碳达峰，2060年前实现碳中和。坚持全国统筹、节约优先、双轮驱动、内外畅通、防范风险的原则，推动能源结构转型，发展绿色低碳经济。\' },\n    { keyword: \'优化营商环境\', interpretation: \'营商环境就是生产力。持续深化"放管服"改革，市场化、法治化、国际化营商环境建设。减税降费、简化审批、保护产权、促进公平竞争，激发市场主体活力。\' },\n    { keyword: \'民生保障体系\', interpretation: \'坚持在发展中保障和改善民生。重点领域：就业优先战略、教育现代化、健康中国建设、多层次社保体系、住房保障。幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶。\' },\n    { keyword: \'新型城镇化\', interpretation: \'以人为核心的新型城镇化。推进农业转移人口市民化，优化城镇化空间布局，提升城市品质，推进城乡融合发展。建设宜居、韧性、智慧城市。\' },\n    { keyword: \'粮食安全\', interpretation: \'粮食安全是"国之大者"。牢牢守住十八亿亩耕地红线，确保谷物基本自给、口粮绝对安全。落实"藏粮于地、藏粮于技"战略，保障粮食和重要农产品稳定安全供给。\' },\n    { keyword: \'银发经济\', interpretation: \'积极应对人口老龄化国家战略。发展银发经济，满足老年人多样化需求。完善养老服务体系：居家社区机构相协调、医养康养相结合。推动养老事业和养老产业协同发展。\' },\n    { keyword: \'新型基础设施\', interpretation: \'新基建包括信息基础设施（5G、大数据中心、人工智能）、融合基础设施（智能交通、智慧能源）、创新基础设施（重大科技基础设施）。是推动数字经济高质量发展的重要支撑。\' },\n    { keyword: \'民营经济发展\', interpretation: \'坚持"两个毫不动摇"：毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展。优化民营经济发展环境，依法保护民营企业产权和企业家权益。\' },\n    { keyword: \'教育强国\', interpretation: \'教育是国之大计、党之大计。建设教育强国：办好人民满意的教育，全面贯彻党的教育方针，落实立德树人根本任务，促进教育公平，培养德智体美劳全面发展的社会主义建设者和接班人。\' },\n    { keyword: \'健康中国\', interpretation: \'把人民健康放在优先发展战略地位。完善公共卫生体系，深化医药卫生体制改革，推动中医药传承创新发展。从以治病为中心转向以健康为中心，全周期保障人民健康。\' },\n    { keyword: \'人才强国\', interpretation: \'人才是第一资源。深入实施人才强国战略，坚持党管人才原则，聚天下英才而用之。完善人才培养、引进、使用、合理流动的工作机制，建设世界重要人才中心和创新高地。\' },\n    { keyword: \'知识产权保护\', interpretation: \'知识产权保护是创新驱动发展的重要保障。全面加强知识产权保护工作，激发全社会创新活力。完善知识产权法律体系，提高知识产权审查效率，加强知识产权运用和公共服务。\' },\n    { keyword: \'基层治理\', interpretation: \'基层治理是国家治理的基石。完善基层治理体系：党建引领基层治理，构建共建共治共享的社会治理格局。推进网格化管理、精细化服务、信息化支撑的基层治理平台建设。\' },\n    { keyword: \'绿色低碳转型\', interpretation: \'推动经济社会发展绿色化、低碳化是高质量发展的关键环节。加快推动产业结构、能源结构、交通运输结构等调整优化，推进工业、建筑、交通等领域清洁低碳转型。\' },\n    { keyword: \'对外开放新格局\', interpretation: \'推进高水平对外开放，稳步扩大规则、规制、管理、标准等制度型开放。加快建设贸易强国，推动共建"一带一路"高质量发展，维护多元稳定的国际经济格局。\' }\n];\n\nconst SHENLUN_ZHENTI = [\n    { year: \'2024国考副省级\', topic: \'坚守初心与时代使命\', material: \'材料围绕基层干部坚守初心、服务群众的故事，以及新时代青年担当使命的案例展开。\', points: \'1.坚守为民服务初心；2.践行时代使命担当；3.将个人理想融入国家发展。\', difficulty: \'中等\' },\n    { year: \'2024国考地市级\', topic: \'城市治理与社区服务\', material: \'材料围绕某市老旧小区改造、社区微治理创新等案例，展示城市基层治理的探索。\', points: \'1.以人民为中心推进城市治理；2.创新社区治理模式；3.发挥群众自治力量。\', difficulty: \'中等\' },\n    { year: \'2023国考副省级\', topic: \'流水与源头——长效机制的构建\', material: \'材料通过多个治理案例，探讨如何从源头治理、建立长效机制，而非"头痛医头"。\', points: \'1.追本溯源，找准问题根源；2.系统思维，构建长效机制；3.防患未然，注重预防。\', difficulty: \'较难\' },\n    { year: \'2023国考地市级\', topic: \'乡村振兴中的文化力量\', material: \'材料展示多个乡村通过挖掘传统文化、发展文化产业实现振兴的案例。\', points: \'1.文化是乡村振兴的灵魂；2.活化传统文化资源；3.以文化人，以文兴业。\', difficulty: \'中等\' },\n    { year: \'2024多省联考\', topic: \'数字赋能基层治理\', material: \'材料围绕多地推进数字化转型、智慧城市建设的实践案例展开。\', points: \'1.数字技术赋能治理创新；2.打破信息孤岛，数据共享；3.科技为民，服务为本。\', difficulty: \'中等\' },\n    { year: \'2023多省联考\', topic: \'人与自然和谐共生的现代化\', material: \'材料展示多地践行"两山"理念、推进生态修复和绿色发展的实践案例。\', points: \'1.践行"两山"理念；2.推动绿色转型发展；3.构建生态文明体系。\', difficulty: \'中等\' },\n    { year: \'2022国考副省级\', topic: \'前瞻性思维与未来眼光\', material: \'材料围绕"今天的决定塑造未来"的主题，展示多个前瞻性决策案例。\', points: \'1.树立前瞻性思维；2.把握未来发展趋势；3.当前行动决定未来格局。\', difficulty: \'较难\' },\n    { year: \'2022国考地市级\', topic: \'融和与融活\', material: \'材料围绕城乡融合、产业融合发展中的"融和"与"融活"两个层面展开。\', points: \'1.理解"融和"与"融活"的关系；2.以融和促进资源整合；3.以融活激发发展活力。\', difficulty: \'较难\' },\n    { year: \'2024北京\', topic: \'城市品质提升\', material: \'材料围绕北京城市更新、品质提升的系列举措和成效展开。\', points: \'1.提升城市功能品质；2.注重历史文化传承；3.增强群众获得感。\', difficulty: \'中等\' },\n    { year: \'2024浙江\', topic: \'高质量发展与共同富裕\', material: \'材料围绕浙江高质量发展建设共同富裕示范区的实践。\', points: \'1.以高质量发展为基；2.缩小收入差距，促进共富；3.创新体制机制保障。\', difficulty: \'中等\' },\n    { year: \'2023江苏A类\', topic: \'政务服务与便民利民\', material: \'材料展示多地政务服务改革、"最多跑一次"等便民举措。\', points: \'1.以人民为中心优化服务；2.创新政务服务模式；3.用数据跑路代替群众跑腿。\', difficulty: \'中等\' },\n    { year: \'2023广东\', topic: \'高质量发展\', material: \'材料围绕广东制造业当家、科技创新、区域协调发展等主题。\', points: \'1.坚持制造业当家；2.以科技创新引领发展；3.促进区域协调平衡。\', difficulty: \'中等\' },\n    { year: \'2024山东\', topic: \'黄河流域生态保护\', material: \'材料围绕山东沿黄地区生态保护和高质量发展的实践案例。\', points: \'1.坚持生态优先；2.推进高质量发展；3.传承黄河文化精神。\', difficulty: \'中等\' },\n    { year: \'2022多省联考\', topic: \'新时代的"赶考"之路\', material: \'材料围绕新时代发展成就与未来挑战，探讨如何走好新时代"赶考"路。\', points: \'1.保持清醒与奋斗精神；2.直面新挑战新问题；3.以实干交出满意答卷。\', difficulty: \'较难\' },\n    { year: \'2024四川\', topic: \'文化传承与创新\', material: \'材料展示四川传统文化保护传承和创新发展案例。\', points: \'1.保护传承优秀传统文化；2.推动文化创新性发展；3.增强文化自信自强。\', difficulty: \'中等\' }\n];\n\nconst GONGWEN_FORMATS = [\n    { type: \'通知\', format: \'标题（关于...的通知）→ 主送机关 → 正文（缘由+事项+要求）→ 落款（发文机关+日期）\', points: \'通知是最常用的公文文种。缘由部分简明扼要说明背景，事项部分条理清晰列出具体内容，要求部分明确执行要求。注意行文语气。\' },\n    { type: \'报告\', format: \'标题（关于...的报告）→ 主送机关 → 正文（情况+问题+下一步打算）→ 结尾（特此报告）→ 落款\', points: \'报告是下级向上级汇报工作的文种。重点写清工作情况、主要成效、存在问题和下一步打算。结尾用"特此报告"，不需上级批复。\' },\n    { type: \'请示\', format: \'标题（关于...的请示）→ 主送机关 → 正文（缘由+请示事项）→ 结尾（妥否，请批示）→ 落款\', points: \'请示是下级向上级请求指示或批准的文种。一文一事，不能多头请示。缘由充分，事项明确，结尾规范。\' },\n    { type: \'函\', format: \'标题（关于...的函）→ 主送机关 → 正文（缘由+商洽/询问/请求事项）→ 结尾（请函复/盼复）→ 落款\', points: \'函是不相隶属机关之间商洽工作、询问和答复问题的文种。语气平和、礼貌，平行文。\' },\n    { type: \'意见\', format: \'标题（关于...的意见）→ 主送机关 → 正文（总体要求+主要任务+保障措施）→ 落款\', points: \'意见是对重要问题提出见解和处理办法的文种。结构完整，内容宏观，指导性强。\' },\n    { type: \'通报\', format: \'标题（关于...的通报）→ 主送机关 → 正文（事实+分析+决定+要求）→ 落款\', points: \'通报是表彰先进、批评错误、传达重要精神和告知重要情况的文种。事实准确，分析透彻，要求明确。\' },\n    { type: \'决定\', format: \'标题（关于...的决定）→ 正文（缘由+决定事项）→ 落款\', points: \'决定是对重要事项作出决策和部署的文种。内容重要，行文庄重，具有权威性。\' },\n    { type: \'讲话稿\', format: \'标题 → 称呼 → 开场白 → 正文（认识+做法+成效+展望）→ 结尾\', points: \'讲话稿要口语化、有感染力。结构清晰，层次分明，观点鲜明，结合实际，语言生动。\' },\n    { type: \'倡议书\', format: \'标题 → 称呼 → 正文（背景+目的+倡议内容）→ 结尾（号召）→ 落款\', points: \'倡议书面向公众，语言要有号召力和感染力。倡议内容条理清晰，具体可行。\' },\n    { type: \'工作总结\', format: \'标题 → 正文（工作情况+主要做法+取得成效+存在不足+下一步计划）→ 落款\', points: \'总结要实事求是，突出重点。做法有特色，成效用数据说话，不足客观分析，计划切实可行。\' },\n    { type: \'调研报告\', format: \'标题 → 正文（背景+基本情况+存在问题+原因分析+对策建议）→ 落款\', points: \'调研报告以事实为基础，以问题为导向。分析深入透彻，建议具体可行，有参考价值。\' },\n    { type: \'方案\', format: \'标题（关于...的方案）→ 正文（指导思想+工作目标+主要任务+实施步骤+保障措施）→ 落款\', points: \'方案要具体可操作。目标明确量化，任务分解到位，步骤安排合理，措施保障有力。\' }\n];\n</script>\n\n<!-- ==================== 内容库：面试 ==================== -->\n<script>\nconst MIANSHI_LILUN = [\n    { type: \'综合分析题\', framework: \'是什么→为什么→怎么办。先表明态度（辩证看待），再分析原因和影响（从多角度多主体分析），最后提出对策建议（具体可行）。\', tips: \'辩证思维是核心：看到事物的两面性，避免绝对化表态。可从国家、社会、个人多层面分析。\' },\n    { type: \'组织管理题\', framework: \'事前（方案策划+人员物资准备）→ 事中（执行实施+协调沟通）→ 事后（总结评估+资料归档）。明确目的意义贯穿始终。\', tips: \'内容要具体细化：时间、地点、人员、方式、内容五要素。注意特殊人群和突发情况的预案。\' },\n    { type: \'人际沟通题\', framework: \'表明态度→分析原因（对领导/同事/群众分别处理）→具体措施→总结反思。以工作为重，以和为贵。\', tips: \'处理原则：对领导尊重服从、对同事理解包容、对群众热情耐心。先反思自身，再找客观原因。\' },\n    { type: \'应急应变题\', framework: \'冷静分析→分轻重缓急→采取措施→事后总结。第一时间控制事态，然后解决核心问题。\', tips: \'处理顺序：人命关天先救人→控制事态蔓延→调查了解原因→妥善处理善后。注意情绪安抚。\' },\n    { type: \'情景处理题\', framework: \'角色定位→分析情况→采取行动→总结反思。代入角色，设身处地解决问题。\', tips: \'要代入情境：你是什么角色、面对什么人、什么事。措施要符合角色权限和身份。\' },\n    { type: \'自我认知题\', framework: \'正确认识自我（优势+不足）→ 岗位匹配度分析 → 未来规划。突出与岗位的匹配性。\', tips: \'优势要具体（用事例说明），不足要真实（非核心缺陷）。报考动机要真诚，职业规划要清晰。\' },\n    { type: \'言语表达题\', framework: \'开场（称呼+引入）→ 主体（分层阐述+事例支撑）→ 结尾（号召+总结）。注意情境和对象。\', tips: \'注意身份和对象：面对领导要汇报、面对群众要亲切、面对同事要平等。语言得体。\' },\n    { type: \'漫画题\', framework: \'描述漫画→揭示寓意→分析论证→提出建议。先客观描述画面，再深入分析寓意。\', tips: \'描述要准确全面，寓意要准确把握（可能有多个寓意），分析要有深度，建议要有针对性。\' }\n];\n\nconst MIANSHI_SUCAI = {\n    名言警句: [\n        { quote: \'路虽远，行则将至；事虽难，做则必成。\', source: \'《荀子·修身》引申\', usage: \'适用于谈坚持、谈实干、谈理想信念\' },\n        { quote: \'天下之本在国，国之本在家，家之本在身。\', source: \'《孟子》\', usage: \'适用于谈修身齐家治国、个人修养\' },\n        { quote: \'纸上得来终觉浅，绝知此事要躬行。\', source: \'陆游《冬夜读书示子聿》\', usage: \'适用于谈实践、谈知行合一\' },\n        { quote: \'利民之事，丝发必兴；厉民之事，毫末必去。\', source: \'《周官》\', usage: \'适用于谈为民服务、群众路线\' },\n        { quote: \'先天下之忧而忧，后天下之乐而乐。\', source: \'范仲淹《岳阳楼记》\', usage: \'适用于谈家国情怀、责任担当\' },\n        { quote: \'不以一眚掩大德。\', source: \'《左传》\', usage: \'适用于谈用人、评价干部、全面看问题\' },\n        { quote: \'安而不忘危，存而不忘亡，治而不忘乱。\', source: \'《周易》\', usage: \'适用于谈忧患意识、国家安全\' },\n        { quote: \'天下事有难易乎？为之，则难者亦易矣。\', source: \'彭端淑《为学》\', usage: \'适用于谈克服困难、勇于实践\' },\n        { quote: \'一语不能践，万卷徒空虚。\', source: \'林逋\', usage: \'适用于谈理论联系实际、反对空谈\' },\n        { quote: \'知屋漏者在宇下，知政失者在草野。\', source: \'王充《论衡》\', usage: \'适用于谈倾听民意、调查研究\' }\n    ],\n    先进人物: [\n        { name: \'黄文秀\', deed: \'北师大硕士毕业后回到家乡广西百色扶贫，带领百坭村88户418人脱贫，2019年因山洪殉职，年仅30岁。\', spirit: \'青春之花绽放在祖国最需要的地方\' },\n        { name: \'张桂梅\', deed: \'创办全国第一所免费女子高中——华坪女高，帮助1800余名女孩走出大山、圆梦大学。\', spirit: \'点亮大山女孩希望之光\' },\n        { name: \'黄旭华\', deed: \'中国核潜艇之父，隐姓埋名30年，在极其艰苦的条件下研制出中国第一艘核潜艇。\', spirit: \'誓干惊天动地事，甘做隐姓埋名人\' },\n        { name: \'袁隆平\', deed: \'杂交水稻之父，一生致力于杂交水稻研究，解决了中国乃至世界的粮食问题。\', spirit: \'禾下乘凉梦，一梦逐一生\' },\n        { name: \'屠呦呦\', deed: \'中国首位诺贝尔生理学或医学奖得主，发现青蒿素，挽救了全球数百万疟疾患者生命。\', spirit: \'几十年如一日，甘坐冷板凳\' },\n        { name: \'钟南山\', deed: \'共和国勋章获得者，非典和新冠疫情期间临危受命，84岁高龄逆行武汉，守护人民健康。\', spirit: \'敢医敢言，国士担当\' },\n        { name: \'张富清\', deed: \'战斗英雄，深藏功名60余年，退役后在贫困山区默默奉献，直到退役军人信息采集才被发现。\', spirit: \'一辈子坚守初心、不改本色\' },\n        { name: \'樊锦诗\', deed: \'敦煌研究院名誉院长，扎根大漠50余年，致力于敦煌文物的保护、研究和传承。\', spirit: \'择一事终一生，不为繁华易匠心\' }\n    ],\n    政策金句: [\n        { quote: \'江山就是人民，人民就是江山。\', source: \'党的二十大报告\', usage: \'适用于谈人民至上、执政为民\' },\n        { quote: \'时代是出卷人，我们是答卷人，人民是阅卷人。\', source: \'习近平总书记讲话\', usage: \'适用于谈责任担当、为民服务\' },\n        { quote: \'绿水青山就是金山银山。\', source: \'习近平生态文明思想\', usage: \'适用于谈生态文明、绿色发展\' },\n        { quote: \'幸福都是奋斗出来的。\', source: \'2018新年贺词\', usage: \'适用于谈奋斗、谈实干\' },\n        { quote: \'打铁必须自身硬。\', source: \'党的十九大报告\', usage: \'适用于谈自身建设、从严治党\' },\n        { quote: \'征途漫漫，惟有奋斗。\', source: \'2021新年贺词\', usage: \'适用于谈奋斗精神、使命担当\' },\n        { quote: \'人民对美好生活的向往，就是我们的奋斗目标。\', source: \'十八届中央政治局常委见面会\', usage: \'适用于谈民生保障、为民服务\' },\n        { quote: \'空谈误国，实干兴邦。\', source: \'习近平总书记讲话\', usage: \'适用于谈实干、反对空谈\' },\n        { quote: \'鞋子合不合脚，自己穿了才知道。\', source: \'习近平总书记讲话\', usage: \'适用于谈中国道路、制度自信\' },\n        { quote: \'逢山开道、遇水架桥。\', source: \'习近平总书记讲话\', usage: \'适用于谈改革创新、攻坚克难\' }\n    ]\n};\n\nconst MIANSHI_REDIAN = [\n    { topic: \'人工智能与就业\', analysis: \'AI技术发展对传统就业市场带来冲击，但也创造新就业岗位。观点：1.技术进步是不可逆转的潮流；2.部分重复性工作会被替代，但创意性、情感性工作难以替代；3.应加强技能培训，提升劳动者素质；4.完善社会保障体系，应对转型期阵痛。\', suggestion: \'拥抱技术变革，主动提升能力，让人工智能成为助手而非对手。\' },\n    { topic: \'银发经济与养老\', analysis: \'我国人口老龄化加速，发展银发经济是应对老龄化的重要途径。观点：1.老龄化是挑战也是机遇；2.银发市场需求巨大且多元化；3.推动养老与医疗、文旅、科技融合；4.发挥社区养老的基础作用。\', suggestion: \'积极应对老龄化，培育银发经济新增长点，构建多层次养老服务体系。\' },\n    { topic: \'直播经济发展\', analysis: \'直播电商快速发展，带动消费但也暴露问题。观点：1.直播经济激发消费活力，助力乡村振兴；2.虚假宣传、质量问题是行业痛点；3.加强监管规范，保护消费者权益；4.推动行业自律，促进健康发展。\', suggestion: \'既鼓励创新又加强监管，让直播经济行稳致远。\' },\n    { topic: \'未成年人网络保护\', analysis: \'未成年人沉迷网络、遭遇网络欺凌等问题引发关注。观点：1.网络是双刃剑，需正确引导；2.平台要落实主体责任，完善防沉迷系统；3.学校和家庭要加强网络素养教育；4.完善法律法规，加大执法力度。\', suggestion: \'多方协同构建未成年人网络保护体系，为成长保驾护航。\' },\n    { topic: \'城市更新与老旧小区改造\', analysis: \'城市更新是提升城市品质、改善民生的重要途径。观点：1.以人民需求为导向推进改造；2.注重历史文化保护传承；3.发挥居民主体作用，共建共治；4.创新融资模式，可持续推进。\', suggestion: \'城市更新要让群众参与、让群众满意，实现城市让生活更美好。\' },\n    { topic: \'乡村振兴与人才回流\', analysis: \'乡村振兴关键在人。越来越多青年返乡创业成为趋势。观点：1.人才是乡村振兴的第一资源；2.完善政策吸引人才返乡；3.搭建创业平台，提供发展空间；4.营造尊才爱才的乡村文化。\', suggestion: \'让乡村成为大有可为的广阔天地，吸引更多人才返乡创业。\' },\n    { topic: \'数字鸿沟与老年人\', analysis: \'数字化给生活带来便利，但也让部分老年人面临"数字鸿沟"。观点：1.数字化不能遗忘老年人；2.保留传统服务方式，提供适老化服务；3.开发适老化数字产品；4.家人和社区帮助老年人跨越鸿沟。\', suggestion: \'科技发展要有温度，让每个人都能享受数字化红利。\' },\n    { topic: \'平台经济与劳动者权益\', analysis: \'外卖骑手、网约车司机等新就业形态劳动者权益保障引关注。观点：1.新就业形态是灵活就业的重要方式；2.劳动者面临社保缺失、劳动关系认定难等问题；3.完善法律法规，明确平台责任；4.建立适应新业态的社保体系。\', suggestion: \'在鼓励创新与保障权益间找到平衡，让新就业形态行稳致远。\' },\n    { topic: \'青少年心理健康\', analysis: \'青少年心理健康问题日益突出。观点：1.心理健康是健康成长的重要基础；2.学业压力、家庭关系、网络影响是主因；3.学校要加强心理健康教育和服务；4.家庭要营造温暖支持的环境。\', suggestion: \'全社会共同关注青少年心理健康，构建防护网络。\' },\n    { topic: \'文化遗产保护传承\', analysis: \'文化遗产是民族的根和魂。观点：1.文化遗产是不可再生的宝贵资源；2.保护与开发要平衡，不能"拆真建假"；3.推动创造性转化和创新性发展；4.让文物"活起来"，融入现代生活。\', suggestion: \'在保护中发展，在传承中创新，让文化遗产"活"在当下。\' },\n    { topic: \'预制菜产业发展\', analysis: \'预制菜产业快速发展引发食品安全和标准讨论。观点：1.预制菜满足快节奏生活需求；2.食品安全是底线，需建立行业标准；3.保障消费者知情权和选择权；4.推动产业规范健康发展。\', suggestion: \'以标准引领发展，以监管保障安全，让消费者放心。\' },\n    { topic: \'基层减负\', analysis: \'形式主义、官僚主义加重基层负担。观点：1.基层是政策落实的"最后一公里"；2.减少不必要的检查考核和文山会海；3.给基层干部更多干事创业的时间和空间；4.建立科学的考核评价机制。\', suggestion: \'为基层减负就是为实干赋能，让基层干部有更多精力服务群众。\' },\n    { topic: \'新能源汽车发展\', analysis: \'我国新能源汽车产业快速发展，产销量居世界首位。观点：1.新能源汽车是汽车产业转型升级方向；2.技术创新是核心竞争力；3.完善充电基础设施，解决"里程焦虑"；4.推动电池回收利用，实现绿色发展。\', suggestion: \'抓住汽车产业变革机遇，推动新能源汽车高质量发展。\' },\n    { topic: \'全民健身\', analysis: \'全民健身已上升为国家战略。观点：1.全民健身是健康中国的重要基础；2.完善公共体育设施，方便群众锻炼；3.推广科学健身知识，提高健身质量；4.推动体育产业与全民健身融合发展。\', suggestion: \'全民健身全民健康，让运动成为生活方式。\' },\n    { topic: \'优化营商环境\', analysis: \'营商环境是企业生存发展的土壤。观点：1.好的营商环境就是生产力；2.深化"放管服"改革，简化审批流程；3.公平竞争是市场经济的灵魂；4.法治是最好的营商环境。\', suggestion: \'打造市场化、法治化、国际化营商环境，激发市场活力。\' }\n];\n</script>\n\n<!-- ==================== 内容库：心灵鸡汤 ==================== -->\n<script>\nconst CHICKEN_SOUP = [\n    { text: \'所有的努力都不会白费，它们只是换了一种方式陪伴你。考公路上，每一道题、每一页书，都在为你的未来铺路。\', author: \'——致每一个奋斗中的考公人\' },\n    { text: \'你背单词时，阿拉斯加的鳕鱼正跃出水面；你算数学时，太平洋彼岸的海鸥振翅掠过城市上空；你晚自习时，极圈上的夜空散漫了五彩斑斓。但是少年，你别着急，在你为自己未来踏踏实实地努力时，那些你感觉从来不会看到的风景，那些你觉得终身不会遇到的人，正一步步向你走来。\', author: \'——致正在拼搏的你\' },\n    { text: \'星光不问赶路人，时光不负有心人。你走过的每一步都算数，熬过的每一个夜晚都会成为光。\', author: \'——致挑灯夜战的你\' },\n    { text: \'别人在你看不到的地方默默努力，在你看得到的地方和你一样游刃有余。你应该像他们一样，在暗处野蛮生长，在明处从容绽放。\', author: \'——致暗自努力的你\' },\n    { text: \'考公不是一场百米冲刺，而是一场马拉松。重要的不是你跑得有多快，而是你一直在跑，从未停下。坚持到最后的人，才能看到最美的风景。\', author: \'——致坚持中的你\' },\n    { text: \'人生没有白走的路，每一步都算数。今天的你，比昨天的你更接近梦想。不要和别人比，要和昨天的自己比，只要在进步，就是胜利。\', author: \'——致进步中的你\' },\n    { text: \'你现在的态度，决定你十年后的高度。每一个不想学习的瞬间，都是未来人生的遗憾。所以，现在、立刻、马上，去学习吧。\', author: \'——致需要鞭策的你\' },\n    { text: \'世界上有两种最耀眼的光芒，一种是太阳，一种是你努力的模样。你认真做题的样子，专注看书的眼神，都是最美的风景。\', author: \'——致专注的你\' },\n    { text: \'当你的才华还撑不起你的野心时，就应该静下心来学习；当你的能力还驾驭不了你的目标时，就应该沉下心来历练。梦想，不是浮躁，而是沉淀和积累。\', author: \'——致沉淀中的你\' },\n    { text: \'这世界上没有哪条路是白白走的路。即便是弯路，也让你看到了不同的风景。即便是失败，也教会了你如何成功。考公路上，没有白费的努力。\', author: \'——致迷茫中的你\' },\n    { text: \'你的对手不是别人，而是昨天的自己。今天的你，要比昨天的你多做一道题，多看一页书，多背一个知识点。日积月累，终会质变。\', author: \'——致每天进步的你\' },\n    { text: \'最怕你一生碌碌无为，还安慰自己平凡可贵。与其羡慕别人的成功，不如从现在开始努力。种一棵树最好的时间是十年前，其次是现在。\', author: \'——致觉醒的你\' },\n    { text: \'每个优秀的人，都有一段沉默的时光。那段时光，是付出了很多努力却得不到结果的日子，我们把它叫做——扎根。考公就是在扎根，终有一天会枝繁叶茂。\', author: \'——致扎根的你\' },\n    { text: \'不要在该奋斗的年纪选择安逸，不要在能拼搏的时候选择放弃。你的人生，由你做主。考公这条路，既然选择了，就勇敢走下去。\', author: \'——致勇敢的你\' },\n    { text: \'生活不会亏待努力的人。你今天流的汗、吃的苦，都会变成明天的光。相信时光，相信努力，相信自己。\', author: \'——致坚持的你\' },\n    { text: \'一个人最好的状态就是：眼里写满了故事，脸上却不见风霜。每天化个淡妆，穿上喜欢的衣裳，不羡慕谁，不嘲笑谁，也不依赖谁，只是悄悄的努力，吞下委屈，喂大格局，改变不了别人就改变自己。\', author: \'——致从容的你\' },\n    { text: \'你若盛开，蝴蝶自来；你若精彩，天自安排。不必焦虑结果，把过程做好，结果自然不会差。你的努力，终会被看见。\', author: \'——致从容的你\' },\n    { text: \'所有的出口成章，都是厚积薄发；所有的从容淡定，都是世事磨砺。考公路上，没有捷径可走。但每一步，都在塑造更好的你。\', author: \'——致磨砺中的你\' },\n    { text: \'生活就像心电图，一帆风顺就说明你挂了。起伏波折才是常态，坚持下去才是本事。考公路上的挫折，只是让你更加强大。\', author: \'——致面对挫折的你\' },\n    { text: \'世界上最远的距离不是天涯海角，而是"知道"和"做到"。你知道要努力，但只有真正做到，才能改变命运。从知道到做到，就是成功的距离。\', author: \'——致知行合一的你\' },\n    { text: \'人最大的对手，往往不是别人，而是自己的懒惰。别指望运气，运气不可能永远在你身上。任何时候都要靠本事吃饭。你必须拼尽全力，才能看上去毫不费力。\', author: \'——致战胜自我的你\' },\n    { text: \'没有人能替你承受痛苦，也没有人能抢走你的坚强。考公路上的每一滴汗水，都是在浇灌成功的花朵。你不是一个人在战斗，所有的考公人都在和你并肩前行。\', author: \'——致坚强的你\' },\n    { text: \'梦想不会发光，发光的是追梦的你。目标不会自动实现，实现的是奋斗的你。加油，考公人！\', author: \'——致追梦的你\' },\n    { text: \'人生就像一杯茶，不会苦一辈子，但总会苦一阵子。考公的苦是暂时的，上岸的甜是永久的。熬过这段苦，就是甜。\', author: \'——致熬苦的你\' },\n    { text: \'你不必比所有人优秀，你只需要比昨天的自己更好。每一次进步，都是向目标迈进。相信积累的力量，相信坚持的意义。\', author: \'——致每天进步的你\' },\n    { text: \'人生没有彩排，每一天都是现场直播。今天的每一分每一秒，都不会重来。所以，珍惜当下，努力学习，让每一天都不留遗憾。\', author: \'——致珍惜时间的你\' },\n    { text: \'不是每一次努力都有收获，但是每一次收获都必须努力。考公路上，不要因为没有立竿见影的效果就放弃。坚持，终将收获。\', author: \'——致坚持的你\' },\n    { text: \'格局决定结局，态度决定高度。你对待考公的态度，决定了你最终的高度。用积极的心态面对每一天，用努力的行动证明自己。\', author: \'——致积极向上的你\' },\n    { text: \'有些路，走下去会很苦很累，但是不走会后悔。既然选择了远方，便只顾风雨兼程。考公这条路，走对了就不怕远。\', author: \'——致勇敢前行的你\' },\n    { text: \'人生最重要的不是所站的位置，而是所朝的方向。不管现在起点多低，只要方向正确，坚持走下去，终会到达理想的彼岸。考公人，加油！\', author: \'——致方向正确的你\' }\n];\n\nconst STUDY_TIPS = [\n    \'番茄工作法：学习25分钟，休息5分钟，每4个番茄钟休息15分钟。高效学习的秘诀。\',\n    \'艾宾浩斯遗忘曲线：学习后20分钟复习一次，1小时后再复习，1天后再复习。科学对抗遗忘。\',\n    \'费曼学习法：学完一个知识点后，尝试用自己的话讲给别人听。讲得清楚才算真懂。\',\n    \'错题本法：把错题分类整理，定期回顾。同样的错误不犯第二次，就是进步。\',\n    \'碎片时间利用：等公交、排队时用手机刷题或看时政。积少成多，聚沙成塔。\',\n    \'主动回忆法：合上书本，主动回忆学过的知识点。比反复阅读更有效。\',\n    \'交叉学习法：不同科目交替学习，避免单一科目疲劳，提高学习效率。\',\n    \'目标分解法：把大目标分解成小任务，比如"今天做完2套资料分析"，完成一个小任务就有成就感。\',\n    \'输出倒逼输入：尝试给同学讲解知识点或写学习笔记，教是最好的学。\',\n    \'黄金时间利用：早上7-9点和晚上8-10点是大脑最活跃的时间，用来攻克难题最有效。\'\n];\n</script>\n\n<!-- ==================== 岗位推荐数据与逻辑 ==================== -->\n<script>\n// 岗位推荐数据库\nconst POSITION_DB = {\n    guokao: [\n        { name: \'中央党群机关\', desc: \'党中央、人大、政协等核心机关\', req: { edu: \'硕士\', fresh: \'不限\', base: \'不限\', political: \'党员优先\' }, competition: \'极高\', match: [\'硕士\',\'博士\'] },\n        { name: \'中央国家行政机关（本级）\', desc: \'国务院各部委，如财政部、外交部\', req: { edu: \'本科\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'高\', match: [\'本科\',\'硕士\',\'博士\'] },\n        { name: \'中央国家行政机关省级以下\', desc: \'海关、税务、铁路公安等垂直管理系统\', req: { edu: \'本科\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'中高\', match: [\'本科\',\'硕士\'] },\n        { name: \'参照公务员法管理事业单位\', desc: \'银保监会、证监会、气象局等\', req: { edu: \'本科\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'中\', match: [\'本科\',\'硕士\',\'博士\'] },\n        { name: \'应届生定向岗位\', desc: \'仅限应届毕业生报考，竞争相对小\', req: { edu: \'本科\', fresh: \'应届\', base: \'不限\', political: \'不限\' }, competition: \'中\', match: [\'应届\'] },\n        { name: \'基层工作经历岗位\', desc: \'要求2年以上基层工作经历\', req: { edu: \'本科\', fresh: \'非应届\', base: \'有\', political: \'不限\' }, competition: \'中低\', match: [\'非应届\',\'有基层\'] },\n        { name: \'四项目人员定向岗位\', desc: \'三支一扶、大学生村官等定向招录\', req: { edu: \'本科\', fresh: \'不限\', base: \'有\', political: \'不限\' }, competition: \'低\', match: [\'四项目\'] },\n        { name: \'退役军人定向岗位\', desc: \'定向招录退役军人\', req: { edu: \'大专\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'低\', match: [\'退役\'] }\n    ],\n    shengkao: [\n        { name: \'省直机关\', desc: \'省委省政府各部门，如省财政厅\', req: { edu: \'本科\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'高\', match: [\'本科\',\'硕士\',\'博士\'] },\n        { name: \'市直机关\', desc: \'市委市政府各部门\', req: { edu: \'本科\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'中高\', match: [\'本科\',\'硕士\',\'博士\'] },\n        { name: \'县区直机关\', desc: \'区县各部门，门槛适中\', req: { edu: \'本科\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'中\', match: [\'大专\',\'本科\',\'硕士\'] },\n        { name: \'乡镇机关\', desc: \'乡镇公务员，招录多门槛低\', req: { edu: \'大专\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'低\', match: [\'大专\',\'本科\',\'硕士\'] },\n        { name: \'应届生定向岗位\', desc: \'仅限应届毕业生，竞争小\', req: { edu: \'本科\', fresh: \'应届\', base: \'不限\', political: \'不限\' }, competition: \'中低\', match: [\'应届\'] },\n        { name: \'基层工作经历岗位\', desc: \'要求2年基层工作经历\', req: { edu: \'本科\', fresh: \'非应届\', base: \'有\', political: \'不限\' }, competition: \'中低\', match: [\'非应届\',\'有基层\'] },\n        { name: \'四项目人员定向岗位\', desc: \'三支一扶等定向招录\', req: { edu: \'大专\', fresh: \'不限\', base: \'有\', political: \'不限\' }, competition: \'低\', match: [\'四项目\'] },\n        { name: \'退役军人定向岗位\', desc: \'定向招录退役军人\', req: { edu: \'高中\', fresh: \'不限\', base: \'不限\', political: \'不限\' }, competition: \'低\', match: [\'退役\'] },\n        { name: \'党员优先岗位\', desc: \'要求中共党员身份的岗位\', req: { edu: \'本科\', fresh: \'不限\', base: \'不限\', political: \'党员\' }, competition: \'中低\', match: [\'党员\'] }\n    ]\n};\n\n// 专业大类映射\nconst MAJOR_CATEGORIES = {\n    \'法学类\': [\'法学\', \'法律\', \'政治学\', \'社会学\', \'马克思主义\'],\n    \'经济金融类\': [\'经济学\', \'金融\', \'财政\', \'国际贸易\', \'会计\', \'审计\'],\n    \'计算机类\': [\'计算机\', \'软件\', \'网络\', \'信息\', \'人工智能\', \'数据\'],\n    \'中文类\': [\'汉语言\', \'新闻\', \'传播\', \'文秘\', \'中文\'],\n    \'管理类\': [\'管理\', \'行政\', \'公共\', \'工商\', \'人力\'],\n    \'理工类\': [\'数学\', \'物理\', \'化学\', \'生物\', \'工程\', \'机械\', \'电子\', \'建筑\'],\n    \'医学类\': [\'医学\', \'临床\', \'护理\', \'药学\', \'卫生\'],\n    \'教育类\': [\'教育\', \'师范\', \'心理学\'],\n    \'其他\': []\n};\n\nfunction recommendPositions() {\n    const edu = document.getElementById(\'rec_edu\')?.value || \'\';\n    const fresh = document.getElementById(\'rec_fresh\')?.value || \'\';\n    const base = document.getElementById(\'rec_base\')?.value || \'\';\n    const political = document.getElementById(\'rec_political\')?.value || \'\';\n    const major = document.getElementById(\'rec_major\')?.value || \'\';\n    const region = document.getElementById(\'rec_region\')?.value || \'\';\n\n    if (!edu) { showToast(\'请选择学历\'); return; }\n\n    const allPositions = POSITION_DB[currentExamType] || [];\n    const results = [];\n\n    allPositions.forEach(pos => {\n        let score = 0;\n        let reasons = [];\n\n        // 学历匹配\n        const eduOrder = [\'高中\', \'大专\', \'本科\', \'硕士\', \'博士\'];\n        const posEduIdx = eduOrder.indexOf(pos.req.edu);\n        const userEduIdx = eduOrder.indexOf(edu);\n        if (userEduIdx >= posEduIdx) { score += 25; reasons.push(\'学历符合\'); }\n\n        // 应届匹配\n        if (pos.req.fresh === \'应届\' && fresh === \'应届\') { score += 20; reasons.push(\'应届生优势\'); }\n        else if (pos.req.fresh === \'非应届\' && fresh === \'非应届\') { score += 15; reasons.push(\'非应届符合\'); }\n        else if (pos.req.fresh === \'不限\') { score += 5; }\n\n        // 基层经历\n        if (pos.req.base === \'有\' && base === \'有\') { score += 20; reasons.push(\'基层经历加分\'); }\n        else if (pos.req.base === \'不限\') { score += 5; }\n        else if (pos.req.base === \'有\' && base !== \'有\') { score -= 30; reasons.push(\'需基层经历\'); }\n\n        // 政治面貌\n        if (pos.req.political === \'党员\' && political === \'党员\') { score += 15; reasons.push(\'党员优势\'); }\n        else if (pos.req.political === \'党员优先\' && political === \'党员\') { score += 10; reasons.push(\'党员优先\'); }\n        else if (pos.req.political === \'不限\') { score += 5; }\n\n        // 竞争度反向加分\n        const compScore = pos.competition === \'低\' ? 15 : pos.competition === \'中低\' ? 10 : pos.competition === \'中\' ? 5 : 0;\n        score += compScore;\n        if (compScore > 0) reasons.push(`竞争${pos.competition}`);\n\n        results.push({ ...pos, score: Math.max(0, score), reasons });\n    });\n\n    // 排序取前4\n    results.sort((a, b) => b.score - a.score);\n    const topResults = results.slice(0, 4);\n\n    const el = document.getElementById(\'recommendResult\');\n    if (!el) return;\n\n    if (topResults.length === 0) {\n        el.innerHTML = \'<p style="text-align:center;color:var(--text-tertiary);padding:20px;">暂无匹配岗位</p>\';\n        return;\n    }\n\n    el.innerHTML = topResults.map((p, i) => {\n        const scoreColor = p.score >= 50 ? \'var(--success)\' : p.score >= 30 ? \'var(--warning)\' : \'var(--danger)\';\n        const compTag = p.competition === \'极高\' || p.competition === \'高\' ? \'tag-red\' : p.competition === \'中高\' || p.competition === \'中\' ? \'tag-orange\' : \'tag-green\';\n        return `\n            <div class="topic-card" style="border:1px solid #dbeafe;">\n                <div class="topic-title">${i + 1}. ${p.name} <span class="tag ${compTag}" style="margin-left:4px;">${p.competition}</span></div>\n                <div class="topic-desc">${p.desc}</div>\n                <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">\n                    <span style="font-size:12px;font-weight:700;color:${scoreColor};">匹配度 ${p.score}分</span>\n                    ${p.reasons.map(r => `<span class="tag tag-blue" style="font-size:10px;">${r}</span>`).join(\'\')}\n                </div>\n            </div>\n        `;\n    }).join(\'\');\n\n    showToast(\'已为你智能推荐\' + topResults.length + \'个岗位\');\n}\n</script>\n\n<!-- ==================== 渲染函数：考试信息 ==================== -->\n<script>\nfunction renderExamInfo() {\n    const area = document.getElementById(\'contentArea\');\n    const info = EXAM_INFO[currentExamType];\n    const dates = Store.get(\'examDates\', {});\n    const examDate = dates[currentExamType] || EXAM_DATES[currentExamType].defaultDate;\n    const countdownDays = document.getElementById(\'countdownDays\').textContent;\n\n    // 时间轴\n    let timelineHtml = info.timeline.map((t, i) => `\n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="font-size:20px;width:28px;text-align:center;flex-shrink:0;">${t.icon}</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">${t.event}</h4>\n                <p style="font-size:12px;">${t.date}</p>\n            </div>\n        </div>\n    `).join(\'\');\n\n    // 报名条件\n    let conditionsHtml = info.conditions.map(c => `\n        <div class="knowledge-list-item">\n            <span><strong>${c.label}</strong></span>\n            <span style="text-align:right;flex:1;padding-left:12px;font-size:13px;color:var(--text-secondary);">${c.value}</span>\n        </div>\n    `).join(\'\');\n\n    // 岗位类型\n    let positionsHtml = info.positions.map(p => {\n        let tagClass = p.competition === \'极高\' || p.competition === \'高\' ? \'tag-red\' : p.competition === \'中高\' || p.competition === \'中\' ? \'tag-orange\' : \'tag-green\';\n        return `\n            <div class="topic-card" onclick="showToast(\'${p.type}\')">\n                <div class="topic-title">${p.type}</div>\n                <div class="topic-desc">${p.desc}</div>\n                <span class="topic-arrow">竞争 <span class="tag ${tagClass}" style="margin-left:4px;">${p.competition}</span></span>\n            </div>\n        `;\n    }).join(\'\');\n\n    // 成绩计算\n    let scoreCalcHtml = info.scoreCalc.map(s => `\n        <div class="recite-item">\n            <span class="recite-item-title">${s.item}</span>\n            <span class="recite-item-tag">${s.formula}</span>\n        </div>\n    `).join(\'\');\n\n    // 加分政策\n    let bonusHtml = info.bonus.map(b => `\n        <div class="tip-card">\n            <span class="tip-tag">+</span>\n            <div class="tip-title">${b.policy}</div>\n            <div class="tip-content">${b.detail}</div>\n        </div>\n    `).join(\'\');\n\n    // FAQ\n    let faqHtml = info.faq.map((f, i) => `\n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-blue">FAQ ${i + 1}</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">${f.q}</div>\n                <div class="question-answer">${f.a}</div>\n            </div>\n        </div>\n    `).join(\'\');\n\n    // 备考规划\n    let planHtml = info.plan.map((p, i) => `\n        <div class="knowledge-item" style="display:flex;gap:10px;align-items:flex-start;">\n            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">${i + 1}</div>\n            <div style="flex:1;">\n                <h4 style="color:var(--primary-dark);font-size:14px;">${p.phase}</h4>\n                <p style="font-size:13px;color:var(--text-secondary);margin-top:2px;">${p.task}</p>\n            </div>\n        </div>\n    `).join(\'\');\n\n    // 备考提示\n    let tipsHtml = info.tips.map(t => `\n        <div class="tip-card">\n            <span class="tip-tag">💡</span>\n            <p style="font-size:13px;color:var(--text-secondary);margin-top:8px;">${t}</p>\n        </div>\n    `).join(\'\');\n\n    // 省份选择（省考时显示）\n    let provinceSelect = \'\';\n    if (currentExamType === \'shengkao\') {\n        let options = Object.keys(PROVINCE_EXAM_INFO).map(p => `<option value="${p}">${p}</option>`).join(\'\');\n        const savedProvince = Store.get(\'province\', \'\');\n        provinceSelect = `\n            <div class="card-white">\n                <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>选择省份 <span class="badge">查看省考信息</span></div>\n                <div class="form-group">\n                    <select class="form-select" onchange="updateProvinceInfo(this.value)">\n                        <option value="">请选择省份</option>\n                        ${options}\n                    </select>\n                </div>\n                <div id="provinceInfo"></div>\n            </div>\n        `;\n        if (savedProvince) {\n            window._pendingProvince = savedProvince;\n        }\n    }\n\n    area.innerHTML = `\n        <div class="module-hero" style="background:linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);box-shadow:0 6px 20px rgba(45,108,223,0.25);">\n            <div class="module-hero-header">\n                <div>\n                    <div class="module-hero-title">📋 ${info.title}</div>\n                    <div class="module-hero-sub">${EXAM_DATES[currentExamType].label} · 笔试日期：${examDate}</div>\n                </div>\n                <button class="module-hero-btn" onclick="openDateModal()">设置日期</button>\n            </div>\n            <div class="module-hero-progress">\n                <div class="progress-label">\n                    <span>距笔试还有</span>\n                    <span style="font-size:20px;font-weight:800;">${countdownDays} 天</span>\n                </div>\n                <div class="progress-bar"><div class="fill" style="width:${Math.max(5, Math.min(100, 100 - parseInt(countdownDays) / 3.65))}%;"></div></div>\n            </div>\n        </div>\n\n        ${provinceSelect}\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>智能岗位推荐</div>\n        <div class="subtitle-hint">填写你的信息 · 系统智能匹配适合的岗位</div>\n        <div class="card-white">\n            <div class="checkin-input-row" style="grid-template-columns:repeat(2,1fr);gap:10px;">\n                <div class="form-group">\n                    <label class="form-label">学历</label>\n                    <select class="form-select" id="rec_edu">\n                        <option value="">请选择</option>\n                        <option value="高中">高中/中专</option>\n                        <option value="大专">大专</option>\n                        <option value="本科">本科</option>\n                        <option value="硕士">硕士研究生</option>\n                        <option value="博士">博士研究生</option>\n                    </select>\n                </div>\n                <div class="form-group">\n                    <label class="form-label">应届/非应届</label>\n                    <select class="form-select" id="rec_fresh">\n                        <option value="">请选择</option>\n                        <option value="应届">应届毕业生</option>\n                        <option value="非应届">非应届</option>\n                    </select>\n                </div>\n                <div class="form-group">\n                    <label class="form-label">基层工作经历</label>\n                    <select class="form-select" id="rec_base">\n                        <option value="">请选择</option>\n                        <option value="无">无</option>\n                        <option value="有">有（2年以上）</option>\n                        <option value="四项目">四项目人员</option>\n                        <option value="退役">退役军人</option>\n                    </select>\n                </div>\n                <div class="form-group">\n                    <label class="form-label">政治面貌</label>\n                    <select class="form-select" id="rec_political">\n                        <option value="">请选择</option>\n                        <option value="群众">群众</option>\n                        <option value="团员">共青团员</option>\n                        <option value="党员">中共党员</option>\n                    </select>\n                </div>\n                <div class="form-group">\n                    <label class="form-label">专业大类</label>\n                    <select class="form-select" id="rec_major">\n                        <option value="">请选择</option>\n                        <option value="法学类">法学类</option>\n                        <option value="经济金融类">经济金融类</option>\n                        <option value="计算机类">计算机类</option>\n                        <option value="中文类">中文/新闻类</option>\n                        <option value="管理类">管理类</option>\n                        <option value="理工类">理工类</option>\n                        <option value="医学类">医学类</option>\n                        <option value="教育类">教育类</option>\n                        <option value="其他">其他</option>\n                    </select>\n                </div>\n                <div class="form-group">\n                    <label class="form-label">意向地区</label>\n                    <select class="form-select" id="rec_region">\n                        <option value="">不限</option>\n                        <option value="中央">中央机关</option>\n                        <option value="省级">省级机关</option>\n                        <option value="市级">市级机关</option>\n                        <option value="县级">县级机关</option>\n                        <option value="乡镇">乡镇机关</option>\n                    </select>\n                </div>\n            </div>\n            <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="recommendPositions()">智能推荐岗位</button>\n            <div id="recommendResult" style="margin-top:14px;"></div>\n        </div>\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>考试时间轴</div>\n        <div class="subtitle-hint">从公告到录用 · 全流程节点</div>\n        <div class="card-white">${timelineHtml}</div>\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>备考时间规划</div>\n        <div class="subtitle-hint">分阶段备考 · 科学安排进度</div>\n        <div class="card-white">${planHtml}</div>\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>常见问题FAQ</div>\n        <div class="subtitle-hint">考生最关心的问题解答</div>\n        ${faqHtml}\n\n        <div class="section-title-bar" style="color:var(--primary);"><span class="bar-line" style="background:var(--primary);"></span>备考提示</div>\n        ${tipsHtml}\n    `;\n\n    // 如果有保存的省份，恢复选择\n    if (window._pendingProvince) {\n        const sel = area.querySelector(\'.form-select\');\n        if (sel) {\n            sel.value = window._pendingProvince;\n            updateProvinceInfo(window._pendingProvince);\n        }\n        window._pendingProvince = null;\n    }\n}\n\nfunction updateProvinceInfo(province) {\n    Store.set(\'province\', province);\n    const info = PROVINCE_EXAM_INFO[province];\n    const el = document.getElementById(\'provinceInfo\');\n    if (info) {\n        el.innerHTML = `\n            <div class="info-banner">\n                <span>📌 <strong>${province}</strong> · 考试时间：${info.time}</span>\n            </div>\n            <p style="font-size:13px;color:var(--text-secondary);">${info.feature}</p>\n            <p style="font-size:13px;color:var(--text-tertiary);margin-top:8px;">💡 建议关注${province}人事考试网获取最新公告信息</p>\n        `;\n    } else {\n        el.innerHTML = \'\';\n    }\n}\n</script>\n\n<!-- ==================== 渲染函数：行测（统一紫色主题） ==================== -->\n<script>\nfunction renderXingceModule(moduleKey) {\n    const area = document.getElementById(\'contentArea\');\n    const mod = XINGCE_MODULES[moduleKey];\n    const today = getTodayStr();\n    const weekDay = [\'周日\',\'周一\',\'周二\',\'周三\',\'周四\',\'周五\',\'周六\'][new Date().getDay()];\n    const examName = EXAM_DATES[currentExamType].name;\n\n    const data = Store.get(\'xingce_\' + moduleKey + \'_v2\', {\n        targetDaily: 10,\n        doneTotal: 0,\n        correctTotal: 0,\n        studyMinutes: 0,\n        reciteCount: 0,\n        records: []\n    });\n\n    const todayRecord = data.records.find(r => r.date === today) || { done: 0, correct: 0, minutes: 0, recite: 0 };\n    const accuracy = data.doneTotal > 0 ? ((data.correctTotal / data.doneTotal) * 100).toFixed(1) : 0;\n    const dailyProgress = Math.min(100, (todayRecord.done / data.targetDaily) * 100);\n\n    // 题型入口\n    const topicsHtml = (mod.topics || []).map((t, i) => `\n        <div class="topic-card" onclick="showTopicTraining(\'${moduleKey}\', ${i})">\n            <div class="topic-title">${t.title} ${t.must ? \'<span class="must">必刷</span>\' : \'\'}</div>\n            <div class="topic-desc">${t.desc}</div>\n            <span class="topic-arrow">›</span>\n        </div>\n    `).join(\'\');\n\n    // 考点速记\n    const reciteHtml = (mod.recite || []).map((r, i) => `\n        <div class="recite-item" onclick="markRecite(\'${moduleKey}\', ${i})">\n            <span class="recite-item-title">${r.title}</span>\n            <span class="recite-item-tag">${r.tag}</span>\n        </div>\n    `).join(\'\');\n\n    // 真题演练\n    const quizHtml = (mod.quiz || []).map((q, i) => renderQuizCard(q, i, moduleKey)).join(\'\');\n\n    // 做题技巧\n    const tipsHtml = mod.tips.map(t => `\n        <div class="tip-card">\n            <span class="tip-tag">💡 技巧</span>\n            <div class="tip-title">${t.title}</div>\n            <div class="tip-content">${t.content}</div>\n        </div>\n    `).join(\'\');\n\n    // 理论知识\n    const theoryHtml = mod.theory.map(t => `\n        <div class="knowledge-item">\n            <h4>${t.title}</h4>\n            <p>${t.content}</p>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="module-hero">\n            <div class="module-hero-header">\n                <div>\n                    <div class="module-hero-title">${mod.icon} ${mod.name}</div>\n                    <div class="module-hero-sub">${today} ${weekDay} · ${examName}</div>\n                </div>\n                <button class="module-hero-btn" onclick="saveXingceCheckin(\'${moduleKey}\')">打卡</button>\n            </div>\n            <div class="module-hero-progress">\n                <div class="progress-label">\n                    <span>今日任务完成度</span>\n                    <span>${dailyProgress.toFixed(0)}%</span>\n                </div>\n                <div class="progress-bar"><div class="fill" style="width:${dailyProgress}%;"></div></div>\n            </div>\n            <div class="hero-stats">\n                <div class="hero-stat-item">\n                    <div class="hero-stat-value">${data.doneTotal}</div>\n                    <div class="hero-stat-label">累计刷题</div>\n                </div>\n                <div class="hero-stat-item">\n                    <div class="hero-stat-value">${accuracy}%</div>\n                    <div class="hero-stat-label">正确率</div>\n                </div>\n                <div class="hero-stat-item">\n                    <div class="hero-stat-value">${data.reciteCount}</div>\n                    <div class="hero-stat-label">背诵点</div>\n                </div>\n            </div>\n        </div>\n\n        <div class="card-white">\n            <div class="checkin-card">\n                <div class="checkin-icon">✓</div>\n                <div style="flex:1;min-width:0;">\n                    <div class="checkin-title">今日备考打卡</div>\n                    <div class="checkin-sub">把控每日备考节奏</div>\n                    <div class="checkin-input-row">\n                        <div class="form-group">\n                            <label class="form-label">学习时长(分钟)</label>\n                            <input type="number" class="form-input" id="inputMinutes_${moduleKey}" value="${todayRecord.minutes || \'\'}" placeholder="0">\n                        </div>\n                        <div class="form-group">\n                            <label class="form-label">刷题数量</label>\n                            <input type="number" class="form-input" id="inputDone_${moduleKey}" value="${todayRecord.done || \'\'}" placeholder="0">\n                        </div>\n                        <div class="form-group">\n                            <label class="form-label">正确数量</label>\n                            <input type="number" class="form-input" id="inputCorrect_${moduleKey}" value="${todayRecord.correct || \'\'}" placeholder="0">\n                        </div>\n                    </div>\n                    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="saveXingceCheckin(\'${moduleKey}\')">保存打卡</button>\n                    <div class="checkin-stats">\n                        <div>\n                            <div class="checkin-stat-value">${(todayRecord.minutes / 60).toFixed(1)}h</div>\n                            <div class="checkin-stat-label">今日时长</div>\n                        </div>\n                        <div>\n                            <div class="checkin-stat-value success">${todayRecord.done}</div>\n                            <div class="checkin-stat-label">刷题</div>\n                        </div>\n                        <div>\n                            <div class="checkin-stat-value warning">${todayRecord.recite || 0}</div>\n                            <div class="checkin-stat-label">背诵</div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        </div>\n\n        ${topicsHtml ? `\n            <div class="section-title-bar"><span class="bar-line"></span>${mod.name}题型入口</div>\n            <div class="subtitle-hint">点击任意题型进入训练</div>\n            <div class="topic-grid">${topicsHtml}</div>\n        ` : \'\'}\n\n        ${reciteHtml ? `\n            <div class="section-title-bar"><span class="bar-line"></span>考点速记背诵</div>\n            <div class="subtitle-hint">高频考点 · 睡前复盘</div>\n            <div class="recite-list">${reciteHtml}</div>\n        ` : \'\'}\n\n        ${quizHtml ? `\n            <div class="section-title-bar"><span class="bar-line"></span>真题演练（点击选项作答）</div>\n            ${quizHtml}\n        ` : \'\'}\n\n        <div class="section-title-bar"><span class="bar-line"></span>理论知识框架</div>\n        <div class="card-white">${theoryHtml}</div>\n\n        <div class="section-title-bar"><span class="bar-line"></span>做题技巧大全 <span class="badge">${mod.tips.length}条</span></div>\n        ${tipsHtml}\n    `;\n}\n\nfunction saveXingceCheckin(moduleKey) {\n    const minutes = parseInt(document.getElementById(`inputMinutes_${moduleKey}`)?.value) || 0;\n    const done = parseInt(document.getElementById(`inputDone_${moduleKey}`)?.value) || 0;\n    const correct = parseInt(document.getElementById(`inputCorrect_${moduleKey}`)?.value) || 0;\n\n    if (correct > done) { showToast(\'正确数不能大于做题数\'); return; }\n\n    const data = Store.get(\'xingce_\' + moduleKey + \'_v2\', { targetDaily: 10, doneTotal: 0, correctTotal: 0, studyMinutes: 0, reciteCount: 0, records: [] });\n    const today = getTodayStr();\n    const existIdx = data.records.findIndex(r => r.date === today);\n\n    let prev = { done: 0, correct: 0, minutes: 0, recite: 0 };\n    if (existIdx >= 0) {\n        prev = data.records[existIdx];\n        data.records[existIdx] = { date: today, done, correct, minutes, recite: prev.recite || 0 };\n    } else {\n        data.records.push({ date: today, done, correct, minutes, recite: 0 });\n    }\n\n    data.doneTotal = data.doneTotal - prev.done + done;\n    data.correctTotal = data.correctTotal - prev.correct + correct;\n    data.studyMinutes = data.studyMinutes - prev.minutes + minutes;\n    if (data.records.length > 100) data.records = data.records.slice(-100);\n\n    Store.set(\'xingce_\' + moduleKey + \'_v2\', data);\n    showToast(\'打卡已保存\');\n    renderXingceModule(moduleKey);\n}\n\nfunction markRecite(moduleKey, idx) {\n    const data = Store.get(\'xingce_\' + moduleKey + \'_v2\', { targetDaily: 10, doneTotal: 0, correctTotal: 0, studyMinutes: 0, reciteCount: 0, records: [] });\n    data.reciteCount = (data.reciteCount || 0) + 1;\n    const today = getTodayStr();\n    const r = data.records.find(x => x.date === today);\n    if (r) r.recite = (r.recite || 0) + 1;\n    else data.records.push({ date: today, done: 0, correct: 0, minutes: 0, recite: 1 });\n    Store.set(\'xingce_\' + moduleKey + \'_v2\', data);\n    showToast(`已背诵：${XINGCE_MODULES[moduleKey].recite[idx].title}`);\n    renderXingceModule(moduleKey);\n}\n\nfunction renderQuizCard(q, idx, moduleKey) {\n    const optionsHtml = q.options.map((opt, i) => `\n        <button class="quiz-option" id="quiz_${moduleKey}_${idx}_${i}" onclick="selectQuizAnswer(\'${moduleKey}\', ${idx}, ${i}, ${q.answer})">${String.fromCharCode(65 + i)}. ${opt}</button>\n    `).join(\'\');\n\n    const passageHtml = q.passage\n        ? `<div class="quiz-passage">${q.passage}</div>`\n        : \'\';\n\n    return `\n        <div class="quiz-card">\n            ${passageHtml}\n            <div class="quiz-question">${idx + 1}. ${q.question}</div>\n            <div class="quiz-options">${optionsHtml}</div>\n            <div id="quiz_analysis_${moduleKey}_${idx}" style="display:none;">\n                <div class="quiz-answer"><strong>解析：</strong>${q.analysis}</div>\n            </div>\n        </div>\n    `;\n}\n\nfunction selectQuizAnswer(moduleKey, qIdx, selected, answer) {\n    const prefix = `quiz_${moduleKey}_${qIdx}_`;\n    const options = document.querySelectorAll(`[id^="${prefix}"]`);\n    options.forEach((btn, i) => {\n        btn.disabled = true;\n        btn.classList.remove(\'selected\');\n        if (i === answer) btn.classList.add(\'correct\');\n        else if (i === selected) btn.classList.add(\'wrong\');\n    });\n    document.getElementById(`quiz_analysis_${moduleKey}_${qIdx}`).style.display = \'block\';\n\n    const data = Store.get(\'xingce_\' + moduleKey + \'_v2\', { doneTotal: 0, correctTotal: 0, records: [] });\n    data.doneTotal = (data.doneTotal || 0) + 1;\n    if (selected === answer) data.correctTotal = (data.correctTotal || 0) + 1;\n    Store.set(\'xingce_\' + moduleKey + \'_v2\', data);\n\n    showToast(selected === answer ? \'回答正确 ✓\' : \'回答错误 ✗\');\n}\n\n// ==================== 题型训练弹窗 ====================\nfunction showTopicTraining(moduleKey, topicIdx) {\n    const mod = XINGCE_MODULES[moduleKey];\n    if (!mod || !mod.topics || !mod.topics[topicIdx]) return;\n    const topic = mod.topics[topicIdx];\n\n    // 从该模块的 quiz 中挑选与该题型相关的题目（简单策略：全部展示该模块真题）\n    const quizHtml = (mod.quiz || []).map((q, i) => renderQuizCard(q, i, moduleKey)).join(\'\');\n\n    // 从 tips 中挑选前3条技巧作为参考\n    const tipsHtml = (mod.tips || []).slice(0, 3).map(t => `\n        <div class="tip-card">\n            <span class="tip-tag">💡 技巧</span>\n            <div class="tip-title">${t.title}</div>\n            <div class="tip-content">${t.content}</div>\n        </div>\n    `).join(\'\');\n\n    // 从 theory 中匹配相关理论\n    const theoryHtml = (mod.theory || []).slice(0, 2).map(t => `\n        <div class="knowledge-item">\n            <h4>${t.title}</h4>\n            <p>${t.content}</p>\n        </div>\n    `).join(\'\');\n\n    const body = document.getElementById(\'trainingModalBody\');\n    body.innerHTML = `\n        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">\n            <div class="modal-title" style="margin-bottom:0;">${mod.icon} ${topic.title} 专项训练</div>\n            <button class="btn btn-outline" onclick="closeTopicTraining()" style="padding:4px 12px;font-size:13px;">✕ 关闭</button>\n        </div>\n        <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:16px;">${topic.desc}</div>\n\n        ${quizHtml ? `\n            <div class="section-title-bar"><span class="bar-line"></span>真题演练</div>\n            ${quizHtml}\n        ` : \'<p style="text-align:center;color:var(--text-tertiary);padding:20px;">暂无真题</p>\'}\n\n        ${theoryHtml ? `\n            <div class="section-title-bar"><span class="bar-line"></span>理论框架</div>\n            <div class="card-white">${theoryHtml}</div>\n        ` : \'\'}\n\n        ${tipsHtml ? `\n            <div class="section-title-bar"><span class="bar-line"></span>做题技巧</div>\n            ${tipsHtml}\n        ` : \'\'}\n    `;\n    document.getElementById(\'trainingModal\').classList.add(\'active\');\n}\n\nfunction closeTopicTraining() {\n    document.getElementById(\'trainingModal\').classList.remove(\'active\');\n}\n</script>\n\n<!-- ==================== 渲染函数：申论 ==================== -->\n<script>\nfunction renderShenlunShizheng() {\n    const area = document.getElementById(\'contentArea\');\n    const today = getTodayStr();\n    const dailyHot = getDailyContent(SHENLUN_SHIZHENG);\n    const listHot = getDailyContents(SHENLUN_SHIZHENG, 5);\n\n    const hotListHtml = SHENLUN_SHIZHENG.map((item, i) => `\n        <div class="hot-item">\n            <div class="hot-number">${i + 1}</div>\n            <div class="hot-content">\n                <h4>${item.keyword}</h4>\n                <p>${item.interpretation.substring(0, 80)}...</p>\n            </div>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="page-title">📰 时政积累</div>\n        <div class="page-subtitle">每日推送时政热点关键词 + 深度解读 | 共${SHENLUN_SHIZHENG.length}条时政热点</div>\n\n        <div class="daily-push">\n            <div class="push-header">\n                <span style="font-size:20px;">🔥</span>\n                <span style="font-weight:600;color:#d46b08;">今日时政关键词</span>\n                <span class="push-date">${today}</span>\n            </div>\n            <div class="push-title">${dailyHot.keyword}</div>\n            <div class="push-content">${dailyHot.interpretation}</div>\n        </div>\n\n        <div class="info-banner">\n            <span>💡 <strong>申论积累建议：</strong>每天精读1-2个时政热点，摘抄金句，尝试用申论语言改写。积累量变到质变。</span>\n        </div>\n\n        <div class="card">\n            <div class="card-title">📋 时政热点词库 <span class="badge">${SHENLUN_SHIZHENG.length}条</span></div>\n            ${hotListHtml}\n        </div>\n    `;\n}\n\nfunction renderShenlunZhenti() {\n    const area = document.getElementById(\'contentArea\');\n    const today = getTodayStr();\n    const dailyQ = getDailyContent(SHENLUN_ZHENTI);\n\n    const allQuestionsHtml = SHENLUN_ZHENTI.map((q, i) => `\n        <div class="question-card">\n            <div class="question-header">\n                <span><span class="tag tag-blue">${q.year}</span> <span class="tag ${q.difficulty === \'较难\' ? \'tag-red\' : \'tag-green\'}">${q.difficulty}</span></span>\n                <span style="color:var(--text-tertiary);">第${i + 1}题</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">${q.topic}</div>\n                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;"><strong>材料：</strong>${q.material}</p>\n                <div class="question-answer">\n                    <strong>📌 答题要点：</strong><br>${q.points}\n                </div>\n            </div>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="page-title">📝 真题回顾</div>\n        <div class="page-subtitle">经典申论真题展示 + 答题思路分析 | 共${SHENLUN_ZHENTI.length}道真题</div>\n\n        <div class="daily-push">\n            <div class="push-header">\n                <span style="font-size:20px;">⭐</span>\n                <span style="font-weight:600;color:#d46b08;">今日推荐真题</span>\n                <span class="push-date">${today}</span>\n            </div>\n            <div class="push-title">${dailyQ.year}：${dailyQ.topic}</div>\n            <div class="push-content">\n                <strong>材料：</strong>${dailyQ.material}<br><br>\n                <strong>答题要点：</strong>${dailyQ.points}\n            </div>\n        </div>\n\n        <div class="info-banner">\n            <span>💡 <strong>真题练习建议：</strong>先自己动手写，再对照答题要点修改。重点关注审题立意和逻辑结构。</span>\n        </div>\n\n        <div class="card">\n            <div class="card-title">📚 真题库 <span class="badge">${SHENLUN_ZHENTI.length}道</span></div>\n            ${allQuestionsHtml}\n        </div>\n    `;\n}\n\nfunction renderShenlunGongwen() {\n    const area = document.getElementById(\'contentArea\');\n    const today = getTodayStr();\n    const dailyFormat = getDailyContent(GONGWEN_FORMATS);\n\n    const allFormatsHtml = GONGWEN_FORMATS.map((f, i) => `\n        <div class="doc-format">\n            <div class="doc-format-header">\n                <span>${f.type}</span>\n                <span class="text-xs text-tertiary">第${i + 1}种</span>\n            </div>\n            <div class="doc-format-body">\n                <p><strong class="key-point">格式：</strong>${f.format}</p>\n                <p style="margin-top:8px;"><strong class="key-point">要点：</strong>${f.points}</p>\n            </div>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="page-title">📄 公文写作</div>\n        <div class="page-subtitle">常见公文格式 + 写作要点 + 范文参考 | 共${GONGWEN_FORMATS.length}种公文</div>\n\n        <div class="daily-push">\n            <div class="push-header">\n                <span style="font-size:20px;">⭐</span>\n                <span style="font-weight:600;color:#d46b08;">今日公文推荐</span>\n                <span class="push-date">${today}</span>\n            </div>\n            <div class="push-title">${dailyFormat.type}</div>\n            <div class="push-content">\n                <strong>格式：</strong>${dailyFormat.format}<br><br>\n                <strong>要点：</strong>${dailyFormat.points}\n            </div>\n        </div>\n\n        <div class="info-banner">\n            <span>💡 <strong>公文写作建议：</strong>格式是基础，内容是关键。多背格式模板，勤动手练习，注意行文语气和用语规范。</span>\n        </div>\n\n        <div class="card">\n            <div class="card-title">📋 公文格式大全 <span class="badge">${GONGWEN_FORMATS.length}种</span></div>\n            ${allFormatsHtml}\n        </div>\n    `;\n}\n</script>\n\n<!-- ==================== 渲染函数：面试 ==================== -->\n<script>\nfunction renderMianshiLilun() {\n    const area = document.getElementById(\'contentArea\');\n    const today = getTodayStr();\n    const dailyTheory = getDailyContent(MIANSHI_LILUN);\n\n    const allTheoryHtml = MIANSHI_LILUN.map((t, i) => `\n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-purple">${t.type}</span>\n                <span style="color:var(--text-tertiary);">第${i + 1}类</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">${t.type}</div>\n                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;"><strong>答题框架：</strong>${t.framework}</p>\n                <div class="question-answer">\n                    <strong>💡 备考提示：</strong>${t.tips}\n                </div>\n            </div>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="page-title">🎓 面试理论学习</div>\n        <div class="page-subtitle">面试题型分类 + 答题框架 | 共${MIANSHI_LILUN.length}类题型</div>\n\n        <div class="daily-push">\n            <div class="push-header">\n                <span style="font-size:20px;">⭐</span>\n                <span style="font-weight:600;color:#d46b08;">今日学习重点</span>\n                <span class="push-date">${today}</span>\n            </div>\n            <div class="push-title">${dailyTheory.type}</div>\n            <div class="push-content">\n                <strong>答题框架：</strong>${dailyTheory.framework}<br><br>\n                <strong>备考提示：</strong>${dailyTheory.tips}\n            </div>\n        </div>\n\n        <div class="info-banner">\n            <span>💡 <strong>面试建议：</strong>掌握框架是基础，灵活运用是关键。建议每天练习1-2道题，录音回听，不断改进表达。</span>\n        </div>\n\n        <div class="card">\n            <div class="card-title">📚 面试题型大全 <span class="badge">${MIANSHI_LILUN.length}类</span></div>\n            ${allTheoryHtml}\n        </div>\n    `;\n}\n\nfunction renderMianshiSucai() {\n    const area = document.getElementById(\'contentArea\');\n    const today = getTodayStr();\n\n    const allQuotes = MIANSHI_SUCAI[\'名言警句\'];\n    const allHeroes = MIANSHI_SUCAI[\'先进人物\'];\n    const allPolicy = MIANSHI_SUCAI[\'政策金句\'];\n\n    const dailyQuote = getDailyContent(allQuotes);\n    const dailyHero = getDailyContent(allHeroes);\n    const dailyPolicy = getDailyContent(allPolicy);\n\n    const quotesHtml = allQuotes.map((q, i) => `\n        <div class="knowledge-item">\n            <h4>"${q.quote}"</h4>\n            <p>—— ${q.source}</p>\n            <p style="margin-top:4px;color:var(--primary);">📌 适用：${q.usage}</p>\n        </div>\n    `).join(\'\');\n\n    const heroesHtml = allHeroes.map((h, i) => `\n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-orange">先进人物</span>\n                <span style="color:var(--text-tertiary);">第${i + 1}位</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">${h.name}</div>\n                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">${h.deed}</p>\n                <div class="question-answer">\n                    <strong>💪 精神品质：</strong>${h.spirit}\n                </div>\n            </div>\n        </div>\n    `).join(\'\');\n\n    const policyHtml = allPolicy.map((q, i) => `\n        <div class="knowledge-item">\n            <h4>"${q.quote}"</h4>\n            <p>—— ${q.source}</p>\n            <p style="margin-top:4px;color:var(--primary);">📌 适用：${q.usage}</p>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="page-title">💎 面试素材积累</div>\n        <div class="page-subtitle">名言警句 + 先进人物 + 政策金句 | 丰富你的答题素材库</div>\n\n        <div class="grid-3" style="margin-bottom:16px;">\n            <div class="card" style="background:linear-gradient(135deg,#f9f0ff,#f0e6ff);">\n                <div style="font-size:24px;margin-bottom:8px;">📜</div>\n                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">今日名言</div>\n                <div style="font-size:14px;font-weight:600;color:#722ed1;">"${dailyQuote.quote}"</div>\n                <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">${dailyQuote.source}</div>\n            </div>\n            <div class="card" style="background:linear-gradient(135deg,#fff7e6,#fff3e6);">\n                <div style="font-size:24px;margin-bottom:8px;">🦸</div>\n                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">今日人物</div>\n                <div style="font-size:14px;font-weight:600;color:#d46b08;">${dailyHero.name}</div>\n                <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">${dailyHero.spirit}</div>\n            </div>\n            <div class="card" style="background:linear-gradient(135deg,#e6f7ff,#d6f0ff);">\n                <div style="font-size:24px;margin-bottom:8px;">🏛️</div>\n                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">今日金句</div>\n                <div style="font-size:14px;font-weight:600;color:#1890ff;">"${dailyPolicy.quote}"</div>\n                <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">${dailyPolicy.source}</div>\n            </div>\n        </div>\n\n        <div class="card">\n            <div class="card-title">📜 名言警句 <span class="badge">${allQuotes.length}条</span></div>\n            ${quotesHtml}\n        </div>\n\n        <div class="card">\n            <div class="card-title">🦸 先进人物 <span class="badge">${allHeroes.length}位</span></div>\n            ${heroesHtml}\n        </div>\n\n        <div class="card">\n            <div class="card-title">🏛️ 政策金句 <span class="badge">${allPolicy.length}条</span></div>\n            ${policyHtml}\n        </div>\n    `;\n}\n\nfunction renderMianshiRedian() {\n    const area = document.getElementById(\'contentArea\');\n    const today = getTodayStr();\n    const dailyHot = getDailyContent(MIANSHI_REDIAN);\n\n    const allHotHtml = MIANSHI_REDIAN.map((h, i) => `\n        <div class="question-card">\n            <div class="question-header">\n                <span class="tag tag-red">热点话题</span>\n                <span style="color:var(--text-tertiary);">第${i + 1}题</span>\n            </div>\n            <div class="question-body">\n                <div class="question-title">${h.topic}</div>\n                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">${h.analysis}</p>\n                <div class="question-answer">\n                    <strong>💡 答题建议：</strong>${h.suggestion}\n                </div>\n            </div>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="page-title">🔥 热点剖析</div>\n        <div class="page-subtitle">社会热点话题 + 多角度分析 | 共${MIANSHI_REDIAN.length}个热点</div>\n\n        <div class="daily-push">\n            <div class="push-header">\n                <span style="font-size:20px;">🔥</span>\n                <span style="font-weight:600;color:#d46b08;">今日热点</span>\n                <span class="push-date">${today}</span>\n            </div>\n            <div class="push-title">${dailyHot.topic}</div>\n            <div class="push-content">\n                <strong>多角度分析：</strong>${dailyHot.analysis}<br><br>\n                <strong>答题建议：</strong>${dailyHot.suggestion}\n            </div>\n        </div>\n\n        <div class="info-banner">\n            <span>💡 <strong>热点备考建议：</strong>关注时事新闻，多角度思考问题。每个热点从原因、影响、对策三个维度分析。</span>\n        </div>\n\n        <div class="card">\n            <div class="card-title">🔥 热点话题库 <span class="badge">${MIANSHI_REDIAN.length}个</span></div>\n            ${allHotHtml}\n        </div>\n    `;\n}\n</script>\n\n<!-- ==================== 渲染函数：心灵鸡汤 ==================== -->\n<script>\nfunction renderChickenSoup() {\n    const area = document.getElementById(\'contentArea\');\n    const today = getTodayStr();\n    const dailySoup = getDailyContent(CHICKEN_SOUP);\n    const dailyTip = getDailyContent(STUDY_TIPS);\n\n    // 学习天数\n    const startDate = Store.get(\'studyStartDate\', \'\');\n    let studyDays = 0;\n    if (startDate) {\n        const start = new Date(startDate);\n        const now = new Date();\n        start.setHours(0,0,0,0);\n        now.setHours(0,0,0,0);\n        studyDays = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;\n    } else {\n        Store.set(\'studyStartDate\', today);\n        studyDays = 1;\n    }\n\n    // 计算所有行测做题总量\n    let totalDone = 0;\n    [\'yanyu\', \'shuliang\', \'panduan\', \'ziliao\', \'changshi\'].forEach(k => {\n        const d = Store.get(\'xingce_\' + k, { doneTotal: 0 });\n        totalDone += d.doneTotal || 0;\n    });\n\n    const allSoupHtml = CHICKEN_SOUP.map((s, i) => `\n        <div class="card" style="background:linear-gradient(135deg,#f8fbff,#eef5ff);">\n            <p style="font-size:15px;line-height:1.8;color:var(--text);">${s.text}</p>\n            <p style="font-size:13px;color:var(--text-tertiary);margin-top:10px;text-align:right;">${s.author}</p>\n        </div>\n    `).join(\'\');\n\n    const allTipsHtml = STUDY_TIPS.map((t, i) => `\n        <div class="tip-card">\n            <span class="tip-tag">📚 方法</span>\n            <div class="tip-title">学习方法 ${i + 1}</div>\n            <div class="tip-content">${t}</div>\n        </div>\n    `).join(\'\');\n\n    area.innerHTML = `\n        <div class="page-title">💪 心灵鸡汤</div>\n        <div class="page-subtitle">每日励志推送 + 学习方法 | 考公路上的精神加油站</div>\n\n        <div class="grid-3" style="margin-bottom:16px;">\n            <div class="card stat-card" style="background:linear-gradient(135deg,#e8f0fe,#d6e8ff);">\n                <div style="font-size:24px;margin-bottom:4px;">📅</div>\n                <div class="stat-value">${studyDays}</div>\n                <div class="stat-label">坚持学习天数</div>\n            </div>\n            <div class="card stat-card" style="background:linear-gradient(135deg,#f6ffed,#e6ffe6);">\n                <div style="font-size:24px;margin-bottom:4px;">✏️</div>\n                <div class="stat-value success">${totalDone}</div>\n                <div class="stat-label">累计做题量</div>\n            </div>\n            <div class="card stat-card" style="background:linear-gradient(135deg,#fff9f0,#fff3e6);">\n                <div style="font-size:24px;margin-bottom:4px;">🔥</div>\n                <div class="stat-value" style="color:#d46b08;">${CHICKEN_SOUP.length}</div>\n                <div class="stat-label">励志语录库</div>\n            </div>\n        </div>\n\n        <div class="motivation-card mb-16">\n            <div class="motivation-text">${dailySoup.text}</div>\n            <div class="motivation-author">${dailySoup.author}</div>\n        </div>\n\n        <div class="daily-push">\n            <div class="push-header">\n                <span style="font-size:20px;">📚</span>\n                <span style="font-weight:600;color:#d46b08;">今日学习方法</span>\n                <span class="push-date">${today}</span>\n            </div>\n            <div class="push-content">${dailyTip}</div>\n        </div>\n\n        <div class="card">\n            <div class="card-title">💪 励志语录大全 <span class="badge">${CHICKEN_SOUP.length}条</span></div>\n            <div class="grid-2">${allSoupHtml}</div>\n        </div>\n\n        <div class="card">\n            <div class="card-title">📚 高效学习方法 <span class="badge">${STUDY_TIPS.length}条</span></div>\n            ${allTipsHtml}\n        </div>\n\n        <div class="card text-center" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;">\n            <div style="font-size:18px;font-weight:600;margin-bottom:8px;">🌟 考公人，加油！</div>\n            <p style="font-size:14px;opacity:0.9;">每一个优秀的人都有一段沉默的时光，那段时光是付出了很多努力却得不到结果的日子，我们把它叫做——扎根。</p>\n            <p style="font-size:14px;opacity:0.9;margin-top:8px;">你正在扎根，终有一天会枝繁叶茂。上岸，只是时间问题。</p>\n        </div>\n    `;\n}\n</script>\n\n<!-- ==================== 初始化 ==================== -->\n<script>\n// 页面加载完成后初始化\nupdateCountdown();\nrenderExamInfo();\n\n// 每分钟更新一次倒计时\nsetInterval(updateCountdown, 60000);\n</script>\n\n\n\n</body></html>');
